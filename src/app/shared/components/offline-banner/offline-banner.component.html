<div class="relative flex flex-col items-center justify-center min-h-screen p-6 overflow-hidden z-1">

  <div class="mx-auto w-full max-w-[242px] text-center sm:max-w-[472px]">

    <h1 class="mb-8 font-bold text-gray-800 text-title-md dark:text-white/90 xl:text-title-2xl">
      NO INTERNET CONNECTION
    </h1>

    <p class="mt-10 mb-6 text-base text-gray-700 dark:text-gray-400 sm:text-lg">
      We couldn't connect to the internet. Please check your Wi-Fi or mobile data connection and try again.
    </p>

    <button
      type="button"
      (click)="retry()"
      [disabled]="isChecking"
      class="inline-flex items-center justify-center rounded-lg border border-gray-300 bg-white px-5 py-3.5 text-sm font-medium text-gray-700 shadow-theme-xs hover:bg-gray-50 hover:text-gray-800 disabled:opacity-50 dark:border-gray-700 dark:bg-gray-800 dark:text-gray-400 dark:hover:bg-white/[0.03]">

      {{ isChecking ? 'Checking connection...' : 'Try Again' }}

    </button>

    <p
      *ngIf="retryMessage"
      class="mt-4 text-sm text-red-600 dark:text-red-400">
      {{ retryMessage }}
    </p>

  </div>

  <p class="absolute text-sm text-center text-gray-500 -translate-x-1/2 bottom-6 left-1/2 dark:text-gray-400">
    &copy; {{ currentYear }} - Sri Mudaliandan Swamy Thirumaligai. All rights reserved.
  </p>

</div>
