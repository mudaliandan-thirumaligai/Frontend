<div class="flex flex-wrap items-center gap-2 mb-4">
  <nav>
    <ol class="flex items-center gap-1">

      <!-- Home -->
      <li>
        <a
          routerLink="/"
          class="inline-flex items-center gap-1
                 text-sm md:text-base font-medium
                 text-indigo-700 dark:text-indigo-300
                 tracking-wide leading-snug hover:underline"
        >
          Home
          <svg
            class="stroke-current"
            width="14"
            height="14"
            viewBox="0 0 17 16"
            fill="none"
          >
            <path
              d="M6.0765 12.667L10.2432 8.50033L6.0765 4.33366"
              stroke="currentColor"
              stroke-width="1.2"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </a>
      </li>

      <!-- OPTIONAL parent -->
      <li *ngIf="parentLabel && parentLink">
        <a
          [routerLink]="parentLink"
          class="inline-flex items-center gap-1
                 text-sm md:text-base font-medium
                 text-indigo-700 dark:text-indigo-300
                 tracking-wide leading-snug hover:underline"
        >
          {{ parentLabel }}
          <svg
            class="stroke-current"
            width="14"
            height="14"
            viewBox="0 0 17 16"
            fill="none"
          >
            <path
              d="M6.0765 12.667L10.2432 8.50033L6.0765 4.33366"
              stroke="currentColor"
              stroke-width="1.2"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </a>
      </li>

      <!-- Current page -->
      <li
        class="text-sm md:text-base font-medium
               text-indigo-900 dark:text-indigo-200
               tracking-wide leading-snug"
      >
        {{ pageTitle }}
      </li>

    </ol>
  </nav>
</div>
