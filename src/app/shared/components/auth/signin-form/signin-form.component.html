<div class="w-full max-w-md pt-10 mx-auto">
  <a
    routerLink="/"
    class="inline-flex items-center text-sm text-gray-500 transition-colors hover:text-gray-700 dark:text-gray-400 dark:hover:text-gray-300"
  >
    <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 20 20" fill="none" class="size-5">
      <path d="M12.7083 5L7.5 10.2083L12.7083 15.4167" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path>
    </svg>
    Back to dashboard
  </a>
</div>

<div class="flex flex-col justify-center flex-1 w-full max-w-md mx-auto">
  <div>
    <div class="mb-5 sm:mb-8">
      <h1 class="mb-2 font-semibold text-gray-800 text-title-sm dark:text-white/90 sm:text-title-md">
        Sign In
      </h1>
      <p class="text-sm text-gray-500 dark:text-gray-400">
        Enter your username and password to sign in!
      </p>
    </div>

    <!-- Form -->
    <form (ngSubmit)="onSignIn()" class="space-y-6">
      <div>
        <app-label>Username <span class="text-error-500">*</span></app-label>
        <app-input-field
          type="text"
          placeholder="admin"
          [(value)]="username"
          name="username"
          class="form-input"
          required
        />
      </div>

      <div>
        <app-label>Password <span class="text-error-500">*</span></app-label>
        <div class="relative">
          <app-input-field
            [type]="showPassword ? 'text' : 'password'"
            placeholder="Enter your password"
            [(value)]="password"
            name="password"
            class="form-input"
            required
          />

          <!-- Toggle Password Visibility using local images -->
          <span
            (click)="togglePasswordVisibility()"
            class="absolute z-30 -translate-y-1/2 cursor-pointer right-4 top-1/2"
          >
            <img
              *ngIf="showPassword; else eyeOffTemplate"
              src="assets/images/eye.png"
              alt="Show password"
              class="w-5 h-5"
            />
            <ng-template #eyeOffTemplate>
              <img
                src="assets/images/eye-off.png"
                alt="Hide password"
                class="w-5 h-5"
              />
            </ng-template>
          </span>
        </div>
      </div>

      <div class="flex items-center justify-between">
        <a
          routerLink="/forgot-password"
          class="text-sm text-brand-500 hover:text-brand-600 dark:text-brand-400"
        >
          Forgot password?
        </a>
      </div>

      <app-button
        class="w-full"
        size="sm"
        (btnClick)="onSignIn()"
      >
        Sign in
      </app-button>
    </form>
  </div>
</div>
