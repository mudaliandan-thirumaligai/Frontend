@if (message) {
  <div 
    class="fixed bottom-6 right-6 px-4 py-3 rounded-lg shadow-lg text-white z-[99999]
           toast-enter toast-enter-active"
    [ngClass]="{
      'bg-green-600': message.type === 'success',
      'bg-red-600': message.type === 'error',
      'bg-blue-600': message.type === 'info'
    }"
  >
    {{ message.text }}
  </div>
}
