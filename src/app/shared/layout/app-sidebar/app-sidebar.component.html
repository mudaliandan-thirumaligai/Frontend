<aside
  class="fixed flex flex-col top-0 px-5 left-0 bg-white dark:bg-gray-900 dark:border-gray-800 text-gray-900 h-screen transition-all duration-300 ease-in-out z-50 border-r border-gray-200"
  [ngClass]="{
    'w-[290px]':
      (isExpanded$ | async) || (isMobileOpen$ | async) || (isHovered$ | async),
    'w-[90px]': !(
      (isExpanded$ | async) ||
      (isMobileOpen$ | async) ||
      (isHovered$ | async)
    ),
    'translate-x-0': isMobileOpen$ | async,
    '-translate-x-full': !(isMobileOpen$ | async),
    'xl:translate-x-0': true
  }"
  (mouseenter)="onSidebarMouseEnter()"
  (mouseleave)="sidebarService.setHovered(false)"
>
  <div
    class="py-8 flex"
    [ngClass]="{
      'xl:justify-center': !((isExpanded$ | async) || (isHovered$ | async)),
      'justify-start': (isExpanded$ | async) || (isHovered$ | async)
    }"
  >
    <a routerLink="/">
      @if ((isExpanded$ | async) || (isHovered$ | async) || (isMobileOpen$ | async)) {
      <img
        class="dark:hidden"
        src="/images/logo/logo.svg"
        alt="Logo"
        width="150"
        height="40"
      />
      <img
        class="hidden dark:block"
        src="/images/logo/logo-dark.svg"
        alt="Logo"
        width="150"
        height="40"
      />
      } @else {
      <img src="/images/logo/logo-icon.svg" alt="Logo" width="32" height="32" />
      }
    </a>
  </div>

  <div class="flex flex-col overflow-y-auto duration-300 ease-linear no-scrollbar">
    <nav class="mb-6">
      <div class="flex flex-col gap-4">
        <!-- Menu Section -->
<div class="flex flex-col overflow-y-auto duration-300 ease-linear no-scrollbar">
  
  <!-- Iterate over each group -->
  <ng-container *ngFor="let group of [{title: 'Admin', items: adminItems},{title: 'Main', items: navItems}, {title: 'Others', items: othersItems}]; let groupIndex = index">
    
    <!-- Group Title -->
    <h2
      class="mb-4 text-xs uppercase flex leading-[20px] text-gray-400"
      [ngClass]="{
        'xl:justify-center': !((isExpanded$ | async) || (isHovered$ | async)),
        'justify-start': (isExpanded$ | async) || (isHovered$ | async)
      }"
    >
      <span *ngIf="(isExpanded$ | async) || (isHovered$ | async) || (isMobileOpen$ | async)">
        {{ group.title }}
      </span>
      <svg *ngIf="!((isExpanded$ | async) || (isHovered$ | async) || (isMobileOpen$ | async))"
        width="1em" height="1em" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M5 12H19" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path>
      </svg>
    </h2>

    <!-- Group Items -->
    <ul class="flex flex-col gap-1">
      <li *ngFor="let nav of group.items; let i = index">

        <!-- If item has subItems -->
        <ng-container *ngIf="nav.subItems; else singleItem">
          <button
            (click)="toggleSubmenu(groupIndex, i)"
            class="menu-item group cursor-pointer"
            [class.menu-item-active]="openSubmenu === groupIndex + '-' + i"
            [class.menu-item-inactive]="openSubmenu !== groupIndex + '-' + i"
            [ngClass]="{
              'xl:justify-center': !((isExpanded$ | async) || (isHovered$ | async)),
              'xl:justify-start': (isExpanded$ | async) || (isHovered$ | async)
            }"
          >
            <span class="menu-item-icon-size" [innerHTML]="nav.icon | safeHtml"></span>
            <span *ngIf="(isExpanded$ | async) || (isHovered$ | async) || (isMobileOpen$ | async)" class="menu-item-text">
              {{ nav.name }}
            </span>

            <svg *ngIf="(isExpanded$ | async) || (isHovered$ | async) || (isMobileOpen$ | async)"
              [ngClass]="{ 'rotate-180 text-brand-500': openSubmenu === groupIndex + '-' + i }"
              width="1em" height="1em" viewBox="0 0 20 20" fill="none"
              class="ml-auto w-5 h-5 transition-transform duration-200">
              <path d="M4.79175 7.396L10 12.6043L15.2084 7.396" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path>
            </svg>
          </button>

          <!-- Submenu -->
          <div
            #subMenu
            [id]="groupIndex + '-' + i"
            class="overflow-hidden transition-all duration-300"
            [ngStyle]="{ height: openSubmenu === groupIndex + '-' + i ? (subMenuHeights[groupIndex + '-' + i] || 0) + 'px' : '0px' }"
          >
            <ul class="mt-2 space-y-1 ml-9">
              <li *ngFor="let subItem of nav.subItems">
                <a [routerLink]="subItem.path" (click)="onSubmenuClick()" class="menu-dropdown-item"
                   [ngClass]="{
                     'menu-dropdown-item-inactive': !isActive(subItem.path),
                     'menu-dropdown-item-active': isActive(subItem.path)
                   }">
                  {{ subItem.name }}
                </a>
              </li>
            </ul>
          </div>
        </ng-container>

        <!-- Single item (no subItems) -->
        <ng-template #singleItem>
          <a [routerLink]="nav.path" class="menu-item group"
             [ngClass]="{
               'xl:justify-center': !((isExpanded$ | async) || (isHovered$ | async)),
               'xl:justify-start': (isExpanded$ | async) || (isHovered$ | async)
             }">
            <span class="menu-item-icon-size" [innerHTML]="nav.icon | safeHtml"></span>
            <span *ngIf="(isExpanded$ | async) || (isHovered$ | async) || (isMobileOpen$ | async)" class="menu-item-text">
              {{ nav.name }}
            </span>
          </a>
        </ng-template>

      </li>
    </ul>

  </ng-container>

</div>

        <!-- end other section -->
      </div>
    </nav>
    @if ((isExpanded$ | async) || (isHovered$ | async) || (isMobileOpen$ | async)) {
    <app-sidebar-widget />
    }
  </div>
</aside>
