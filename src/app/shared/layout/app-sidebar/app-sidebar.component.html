<!-- Mobile Sidebar Toggle Button (always visible on mobile) -->
<button
  class="xl:hidden fixed top-4 left-4 z-[9999] 
         bg-white dark:bg-gray-800 p-2 rounded-lg shadow-lg
         text-gray-700 dark:text-gray-200"
  (click)="sidebarService.toggleMobileOpen()"
>
  <svg 
    xmlns="http://www.w3.org/2000/svg" 
    fill="none" 
    viewBox="0 0 24 24" 
    stroke-width="1.5" 
    stroke="currentColor" 
    class="w-7 h-7"
  >
    <path stroke-linecap="round" stroke-linejoin="round"
      d="M3.75 6.75h16.5M3.75 12h16.5M3.75 17.25h16.5" />
  </svg>
</button>

<aside
  class="fixed flex flex-col top-0 px-5 left-0 bg-white dark:bg-gray-900 dark:border-gray-800 text-gray-900 h-screen transition-all duration-300 ease-in-out z-50 border-r border-gray-200"
  [ngClass]="{
    'w-[290px]':
      (isExpanded$ | async) || (isMobileOpen$ | async) || (isHovered$ | async),
    'w-[90px]': !(
      (isExpanded$ | async) ||
      (isMobileOpen$ | async) ||
      (isHovered$ | async)
    ),
    'translate-x-0': isMobileOpen$ | async,
    '-translate-x-full': !(isMobileOpen$ | async),
    'xl:translate-x-0': true
  }"
  (mouseenter)="onSidebarMouseEnter()"
  (mouseleave)="sidebarService.setHovered(false)"
>
<!-- Sidebar component -->
  <div
    class="py-8 flex"
    [ngClass]="{
      'xl:justify-center': !((isExpanded$ | async) || (isHovered$ | async)),
      'justify-start': (isExpanded$ | async) || (isHovered$ | async)
    }"
  >
    <button 
      (click)="toggleSidebar()" 
      class="flex items-center justify-center w-10 h-10 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-800 transition"
    >
      <!-- Hamburger icon -->
      <svg 
        xmlns="http://www.w3.org/2000/svg" 
        fill="none" 
        viewBox="0 0 24 24" 
        stroke-width="1.5" 
        stroke="currentColor" 
        class="w-7 h-7"
      >
        <path stroke-linecap="round" stroke-linejoin="round" 
          d="M3.75 6.75h16.5M3.75 12h16.5M3.75 17.25h16.5" />
      </svg>
    </button>
  </div>
  <!-- THEME TOGGLE BLOCK -->
<div
  class="mt-4 flex items-center p-3 rounded-lg cursor-pointer hover:bg-gray-100 dark:hover:bg-gray-800 transition-all"
  [ngClass]="{
      'justify-start': (isExpanded$ | async) || (isHovered$ | async) || (isMobileOpen$ | async),
      'justify-center': !((isExpanded$ | async) || (isHovered$ | async) || (isMobileOpen$ | async))
  }"
>
  <app-theme-toggle-button />

  <!-- Show text only when expanded -->
  <span
    *ngIf="(isExpanded$ | async) || (isHovered$ | async) || (isMobileOpen$ | async)"
    class="ml-3 text-sm text-gray-700 dark:text-gray-300"
  >
    Change Theme
  </span>
</div>


  <div class="flex flex-col overflow-y-auto duration-300 ease-linear no-scrollbar">
    <nav class="mb-6">
      <div class="flex flex-col gap-4">
        <!-- Menu Section -->
<div class="flex flex-col overflow-y-auto duration-300 ease-linear no-scrollbar">
  
  <!-- Iterate over each group -->
 <ng-container *ngFor="let group of [
  { title: 'Admin', items: adminItems, show: role === 'admin' },
  { title: 'User', items: userItems, show: role === 'user'},
  { title: 'Main', items: navItems, show: true },
  { title: 'Others', items: othersItems, show: true }
]">

  <ng-container *ngIf="group.show">
    
    <!-- Group Title -->
    <h2
      class="mb-4 text-xs uppercase flex leading-[20px] text-gray-400"
      [ngClass]="{
        'xl:justify-center': !((isExpanded$ | async) || (isHovered$ | async)),
        'justify-start': (isExpanded$ | async) || (isHovered$ | async)
      }"
    >
      <span *ngIf="(isExpanded$ | async) || (isHovered$ | async) || (isMobileOpen$ | async)">
        {{ group.title }}
      </span>
      <svg *ngIf="!((isExpanded$ | async) || (isHovered$ | async) || (isMobileOpen$ | async))"
        width="1em" height="1em" viewBox="0 0 24 24" fill="none">
        <path d="M5 12H19" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path>
      </svg>
    </h2>

    <!-- Group Items -->
    <ul class="flex flex-col gap-1">
      <li *ngFor="let nav of group.items; let i = index">

        <!-- Submenu -->
        <ng-container *ngIf="nav.subItems; else singleItem">
          <button
            (click)="toggleSubmenu(group.title, i)"
            class="menu-item group cursor-pointer"
            [class.menu-item-active]="openSubmenu === group.title + '-' + i"
            [class.menu-item-inactive]="openSubmenu !== group.title + '-' + i"
          >
            <span class="menu-item-icon-size" [innerHTML]="nav.icon | safeHtml"></span>
            <span *ngIf="(isExpanded$ | async) || (isHovered$ | async) || (isMobileOpen$ | async)"
              class="menu-item-text">
              {{ nav.name }}
            </span>
          </button>

          <div
            #subMenu
            [id]="group.title + '-' + i"
            class="overflow-hidden transition-all duration-300"
            [ngStyle]="{ height: openSubmenu === group.title + '-' + i ? (subMenuHeights[group.title + '-' + i] || 0) + 'px' : '0px' }"
          >
            <ul class="mt-2 space-y-1 ml-9">
              <li *ngFor="let subItem of nav.subItems">
                <a [routerLink]="subItem.path" class="menu-dropdown-item">
                  {{ subItem.name }}
                </a>
              </li>
            </ul>
          </div>
        </ng-container>

        <!-- Single item -->
        <ng-template #singleItem>
            <ng-container *ngIf="nav.action; else linkItem">
              <button 
                (click)="nav.action()" 
                class="menu-item group w-full text-left flex items-center gap-3 p-2 rounded-lg
                      hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors duration-200"
              >
                <span class="menu-item-icon-size" [innerHTML]="nav.icon | safeHtml"></span>
                <span *ngIf="(isExpanded$ | async) || (isHovered$ | async) || (isMobileOpen$ | async)"
                      class="menu-item-text text-gray-700 dark:text-gray-300">
                  {{ nav.name }}
                </span>
              </button>

            </ng-container>

            <ng-template #linkItem>
              <a [routerLink]="nav.path" class="menu-item group">
                <span class="menu-item-icon-size" [innerHTML]="nav.icon | safeHtml"></span>
                <span *ngIf="(isExpanded$ | async) || (isHovered$ | async) || (isMobileOpen$ | async)"
                      class="menu-item-text">
                  {{ nav.name }}
                </span>
              </a>
            </ng-template>

        </ng-template>

      </li>
    </ul>

  </ng-container>

</ng-container>


</div>

        <!-- end other section -->
      </div>
    </nav>
    @if ((isExpanded$ | async) || (isHovered$ | async) || (isMobileOpen$ | async)) {
    <app-sidebar-widget />
    }
  </div>
</aside>
