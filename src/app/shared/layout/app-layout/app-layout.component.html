
<!-- Scroll Progress Indicator -->
<div class="fixed top-0 left-0 w-full h-1 bg-gray-300 dark:bg-gray-700 z-[60]">
  <div
    class="h-1 bg-blue-800 dark:bg-blue-500 transition-all duration-150"
    [style.width]="scrollPercent + '%'">
  </div>
</div>


<!-- Main Sticky Header -->
<header
  class="sticky top-0 left-0 right-0 w-full z-50
         shadow-sm backdrop-blur-md
         transition-all duration-300
         bg-gradient-to-r from-indigo-50/80 to-blue-100/80
         dark:from-neutral-900/80 dark:to-neutral-800/80">

  <!-- ROW 1: LOGO + TITLE -->
  <div
    class="w-full flex flex-col sm:flex-row
           items-center justify-center
           gap-1 sm:gap-4 px-4 py-2">

    <a routerLink="/" class="flex-shrink-0">
      <img
        src="images/mudaliandan/thenkalai-thriuman.png"
        alt="Logo"
        class="h-14 md:h-16 object-contain
               drop-shadow-md transition-transform
               duration-300 hover:scale-105 cursor-pointer"
      />
    </a>

    <div
      class="text-lg md:text-xl font-semibold
             text-indigo-700 dark:text-indigo-300
             tracking-wide leading-tight text-center">

      Sri Mudaliandan Swami Thirumaligai

    </div>

  </div>


  <!-- ROW 2: MAIN NAVIGATION -->
  <nav
    class="w-full border-t border-indigo-200/70
           dark:border-neutral-700 px-3 py-2">

    <div
      class="flex flex-wrap justify-center items-center
             gap-2 sm:gap-4">

      <a
        *ngFor="let item of mainMenu"
        [routerLink]="item.route"
        routerLinkActive="bg-indigo-200 dark:bg-indigo-900
                          text-indigo-900 dark:text-indigo-100"
        [routerLinkActiveOptions]="{ exact: true }"
        class="px-4 py-2 rounded-lg
               text-sm sm:text-base font-semibold
               text-indigo-700 dark:text-indigo-300
               border border-indigo-200 dark:border-indigo-700
               hover:bg-indigo-100 dark:hover:bg-neutral-700
               hover:text-indigo-900 dark:hover:text-indigo-100
               transition-all duration-200
               whitespace-nowrap">

        {{ item.label }}

      </a>

    </div>

  </nav>


  <!-- ROW 3: SECONDARY NAVIGATION -->
  <nav
    class="w-full border-t border-indigo-200/70
           dark:border-neutral-700 px-3 py-2">

    <div
      class="flex flex-wrap justify-center items-center
             gap-2">

      <a
        *ngFor="let item of secondaryMenu"
        [routerLink]="item.route"
        routerLinkActive="bg-indigo-200 dark:bg-indigo-900
                          text-indigo-900 dark:text-indigo-100"
        [routerLinkActiveOptions]="{ exact: true }"
        class="px-3 py-2 rounded-lg
               text-xs sm:text-sm font-medium
               text-indigo-600 dark:text-indigo-300
               border border-indigo-200 dark:border-indigo-800
               hover:bg-indigo-100 dark:hover:bg-neutral-700
               hover:text-indigo-900 dark:hover:text-indigo-100
               transition-all duration-200
               whitespace-nowrap">

        {{ item.label }}

      </a>

    </div>

  </nav>

</header>


<!-- Main Content -->
<div class="min-h-screen">

  <div class="mx-auto max-w-(--breakpoint-2xl)">

    <router-outlet></router-outlet>

    <app-footer></app-footer>

  </div>

</div>
