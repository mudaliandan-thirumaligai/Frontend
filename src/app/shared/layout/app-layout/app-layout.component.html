<!-- Scroll Progress Indicator -->
<div class="fixed top-0 left-0 w-full h-1 bg-gray-300 dark:bg-gray-700 z-[60]">
  <div
    class="h-1 bg-blue-800 dark:bg-blue-500 transition-all duration-150"
    [style.width]="scrollPercent + '%'">
  </div>
</div>


<!-- ===================== DESKTOP / TABLET HEADER (unchanged) ===================== -->
<header
  class="hidden md:block sticky top-0 left-0 right-0 w-full z-50
         shadow-sm backdrop-blur-md transition-all duration-300
         bg-gradient-to-r from-indigo-50/80 to-blue-100/80
         dark:from-neutral-900/80 dark:to-neutral-800/80">

  <!-- ROW 1: LOGO + TITLE -->
  <div class="w-full flex flex-col sm:flex-row items-center justify-center gap-1 sm:gap-4 px-4 py-2">
    <a routerLink="/" class="flex-shrink-0">
      <img src="images/mudaliandan/thenkalai-thriuman.png" alt="Logo"
           class="h-14 md:h-16 object-contain drop-shadow-md transition-transform duration-300 hover:scale-105 cursor-pointer" />
    </a>
    <div class="text-lg md:text-xl font-semibold text-indigo-900 dark:text-indigo-300 tracking-wide leading-tight text-center">
      Sri Mudaliandan Swami Thirumaligai
    </div>
  </div>

  <!-- ROW 2: MAIN NAVIGATION -->
  <nav class="w-full border-t border-indigo-200/70 dark:border-neutral-700 px-3 py-2">
    <div class="flex flex-wrap justify-center items-center gap-2 sm:gap-4">
      <a *ngFor="let item of mainMenu"
         [routerLink]="item.route"
         routerLinkActive="bg-indigo-200 dark:bg-indigo-900 text-indigo-900 dark:text-indigo-100"
         [routerLinkActiveOptions]="{ exact: true }"
         class="px-4 py-2 rounded-lg text-sm sm:text-base font-semibold
                text-indigo-700 dark:text-indigo-300
                border border-indigo-200 dark:border-indigo-700
                hover:bg-indigo-100 dark:hover:bg-neutral-700
                hover:text-indigo-900 dark:hover:text-indigo-100
                transition-all duration-200 whitespace-nowrap">
        {{ item.label }}
      </a>
    </div>
  </nav>

  <!-- ROW 3: SECONDARY NAVIGATION -->
  <nav class="w-full border-t border-indigo-200/70 dark:border-neutral-700 px-3 py-2">
    <div class="flex flex-wrap justify-center items-center gap-2">
      <a *ngFor="let item of secondaryMenu"
         [routerLink]="item.route"
         routerLinkActive="bg-indigo-200 dark:bg-indigo-900 text-indigo-900 dark:text-indigo-100"
         [routerLinkActiveOptions]="{ exact: true }"
         class="px-3 py-2 rounded-lg text-xs sm:text-sm font-medium
                text-indigo-600 dark:text-indigo-300
                border border-indigo-200 dark:border-indigo-800
                hover:bg-indigo-100 dark:hover:bg-neutral-700
                hover:text-indigo-900 dark:hover:text-indigo-100
                transition-all duration-200 whitespace-nowrap">
        {{ item.label }}
      </a>
    </div>
  </nav>
</header>


<!-- ===================== MOBILE TOP APP BAR ===================== -->
<header
  class="md:hidden sticky top-0 left-0 right-0 z-50 h-14
         flex items-center gap-2 px-3
         backdrop-blur-md shadow-sm
         bg-gradient-to-r from-indigo-50/95 to-blue-100/95
         dark:from-neutral-900/95 dark:to-neutral-800/95
         transition-transform duration-300"
  [class.-translate-y-full]="hideMobileBar && !moreOpen && !showBack">

  <!-- Inner pages: big labelled Back button + page title -->
  <ng-container *ngIf="showBack; else brandBar">
    <button type="button" (click)="goBack()" aria-label="Go back"
            class="flex items-center gap-1 h-11 pl-1 pr-3 -ml-1 rounded-xl flex-shrink-0
                   text-base font-semibold
                   text-indigo-900 dark:text-indigo-200
                   active:bg-indigo-200/70 dark:active:bg-neutral-700 transition">
      <svg class="w-7 h-7" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"
           stroke-linecap="round" stroke-linejoin="round">
        <path d="M15 5 8 12l7 7"/>
      </svg>
      <span>Back</span>
    </button>

    <div class="flex-1 min-w-0 truncate text-[17px] font-semibold
                text-indigo-900 dark:text-indigo-200">
      {{ pageTitle }}
    </div>
  </ng-container>

  <!-- Top-level pages: logo + site name -->
  <ng-template #brandBar>
    <a routerLink="/" class="flex-shrink-0" (click)="closeMore()">
      <img src="images/mudaliandan/thenkalai-thriuman.png" alt="Logo"
           class="h-10 w-auto object-contain" />
    </a>
    <div class="flex-1 min-w-0 truncate text-[15px] font-semibold
                text-indigo-900 dark:text-indigo-300 tracking-wide">
      Sri Mudaliandan Swami Thirumaligai
    </div>
  </ng-template>
</header>


<!-- ===================== MOBILE BOTTOM TAB BAR ===================== -->
<nav
  class="md:hidden fixed bottom-0 left-0 right-0 z-50
         border-t border-indigo-200 dark:border-neutral-700
         bg-white/95 dark:bg-neutral-900/95 backdrop-blur-md
         pb-[env(safe-area-inset-bottom)]"
  aria-label="Primary">

  <div class="grid grid-cols-5 h-16">

    <!-- Home -->
    <a routerLink="/" #rlaHome="routerLinkActive"
       routerLinkActive
       [routerLinkActiveOptions]="{ exact: true }"
       (click)="closeMore()"
       class="flex flex-col items-center justify-center gap-0.5
              text-indigo-900 dark:text-indigo-200 active:scale-95 transition">
      <span class="flex items-center justify-center w-14 h-8 rounded-full transition-colors"
            [class.bg-indigo-100]="rlaHome.isActive"
            [class.dark:bg-indigo-900/60]="rlaHome.isActive">
        <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>
        </svg>
      </span>
      <span class="text-[11px] leading-none tracking-tight"
            [class.font-bold]="rlaHome.isActive" [class.font-medium]="!rlaHome.isActive">Home</span>
    </a>

    <!-- About -->
    <a routerLink="/about-thirumaaligai" #rlaAbout="routerLinkActive"
       routerLinkActive
       [routerLinkActiveOptions]="{ exact: true }"
       (click)="closeMore()"
       class="flex flex-col items-center justify-center gap-0.5
              text-indigo-900 dark:text-indigo-200 active:scale-95 transition">
      <span class="flex items-center justify-center w-14 h-8 rounded-full transition-colors"
            [class.bg-indigo-100]="rlaAbout.isActive"
            [class.dark:bg-indigo-900/60]="rlaAbout.isActive">
        <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"
             stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="9"/>
          <path d="M12 11v5.5M12 7.5h.01"/>
        </svg>
      </span>
      <span class="text-[11px] leading-none tracking-tight"
            [class.font-bold]="rlaAbout.isActive" [class.font-medium]="!rlaAbout.isActive">About</span>
    </a>

    <!-- Calendar -->
    <a routerLink="/calendar" #rlaCal="routerLinkActive"
       routerLinkActive
       [routerLinkActiveOptions]="{ exact: true }"
       (click)="closeMore()"
       class="flex flex-col items-center justify-center gap-0.5
              text-indigo-900 dark:text-indigo-200 active:scale-95 transition">
      <span class="flex items-center justify-center w-14 h-8 rounded-full transition-colors"
            [class.bg-indigo-100]="rlaCal.isActive"
            [class.dark:bg-indigo-900/60]="rlaCal.isActive">
        <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"
             stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="4.5" width="18" height="16.5" rx="2"/>
          <path d="M3 9.5h18M8 2.5v4M16 2.5v4"/>
        </svg>
      </span>
      <span class="text-[11px] leading-none tracking-tight"
            [class.font-bold]="rlaCal.isActive" [class.font-medium]="!rlaCal.isActive">Calendar</span>
    </a>

    <!-- Sambhavanai (folded hands) -->
    <a routerLink="/bank-info" #rlaBank="routerLinkActive"
       routerLinkActive
       [routerLinkActiveOptions]="{ exact: true }"
       (click)="closeMore()"
       class="flex flex-col items-center justify-center gap-0.5
              text-indigo-900 dark:text-indigo-200 active:scale-95 transition">
      <span class="flex items-center justify-center w-14 h-8 rounded-full transition-colors"
            [class.bg-indigo-100]="rlaBank.isActive"
            [class.dark:bg-indigo-900/60]="rlaBank.isActive">
        <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 3c-2.6 3.4-4.6 6.3-4.6 9.6 0 1 .2 1.9.6 2.8L9 20.5h6l1-5.1c.4-.9.6-1.8.6-2.8C16.6 9.3 14.6 6.4 12 3z"/>
          <path d="M12 3.5v12.5"/>
          <path d="M9.8 14.6 12 16.8l2.2-2.2"/>
        </svg>
      </span>
      <span class="text-[11px] leading-none tracking-tight"
            [class.font-bold]="rlaBank.isActive" [class.font-medium]="!rlaBank.isActive">Sambhavanai</span>
    </a>

    <!-- More (also highlighted when on a page opened from the sheet) -->
    <button type="button" (click)="toggleMore()"
            class="flex flex-col items-center justify-center gap-0.5
                   text-indigo-900 dark:text-indigo-200 active:scale-95 transition"
            [attr.aria-expanded]="moreOpen" aria-label="More">
      <span class="flex items-center justify-center w-14 h-8 rounded-full transition-colors"
            [class.bg-indigo-100]="moreOpen || isMoreRoute"
            [class.dark:bg-indigo-900/60]="moreOpen || isMoreRoute">
        <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"
             stroke-linecap="round" stroke-linejoin="round">
          <rect x="3.5" y="3.5" width="7" height="7" rx="1.5"/>
          <rect x="13.5" y="3.5" width="7" height="7" rx="1.5"/>
          <rect x="3.5" y="13.5" width="7" height="7" rx="1.5"/>
          <rect x="13.5" y="13.5" width="7" height="7" rx="1.5"/>
        </svg>
      </span>
      <span class="text-[11px] leading-none tracking-tight"
            [class.font-bold]="moreOpen || isMoreRoute"
            [class.font-medium]="!(moreOpen || isMoreRoute)">More</span>
    </button>
  </div>
</nav>


<!-- ===================== MOBILE "MORE" BOTTOM SHEET ===================== -->
<ng-container *ngIf="moreOpen">
  <!-- Backdrop -->
  <div class="md:hidden fixed inset-0 z-[70] bg-black/40 sheet-fade" (click)="closeMore()"></div>

  <!-- Sheet -->
  <div
    class="md:hidden fixed left-0 right-0 bottom-0 z-[80]
           max-h-[85vh] overflow-y-auto overscroll-contain
           rounded-t-3xl shadow-2xl sheet-up
           bg-white dark:bg-neutral-900
           pb-[calc(1.5rem+env(safe-area-inset-bottom))]"
    role="dialog" aria-modal="true" aria-label="More navigation">

    <!-- Sticky handle + close -->
    <div class="sticky top-0 bg-white dark:bg-neutral-900 pt-2 pb-1 px-4 z-10">
      <div class="mx-auto h-1.5 w-10 rounded-full bg-neutral-300 dark:bg-neutral-600"></div>
      <div class="flex items-center justify-between mt-1">
        <h2 class="text-base font-semibold text-indigo-900 dark:text-indigo-200">Explore</h2>
        <button type="button" (click)="closeMore()" aria-label="Close"
                class="p-1.5 -mr-1.5 rounded-full text-indigo-900 dark:text-indigo-200
                      hover:bg-indigo-50 dark:hover:bg-neutral-800">
          <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
              stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
        </button>
      </div>
    </div>

    <div class="px-2 space-y-5">
      <section *ngFor="let group of mobileGroups">
        <h3 class="text-base font-semibold text-indigo-900 dark:text-indigo-200">
          {{ group.title }}
        </h3>
        <div class="grid grid-cols-2 gap-2">
          <a *ngFor="let item of group.items"
             [routerLink]="item.route"
             routerLinkActive="bg-indigo-100 dark:bg-indigo-900/60 text-indigo-900 dark:text-indigo-100 border-indigo-300 dark:border-indigo-700"
             [routerLinkActiveOptions]="{ exact: true }"
             (click)="closeMore()"
             class="flex items-center min-h-12 px-3 py-2 rounded-xl border
              border-neutral-200 dark:border-neutral-700
              bg-neutral-50 dark:bg-neutral-800
              text-sm font-medium leading-snug
              text-indigo-600 dark:text-indigo-400
              active:scale-[0.97] transition">
            {{ item.label }}
          </a>
        </div>
      </section>
    </div>
  </div>
</ng-container>


<!-- Main Content -->
<div class="min-h-screen pb-16 md:pb-0">

  <div class="mx-auto max-w-(--breakpoint-2xl)">

    <router-outlet></router-outlet>

    <app-footer></app-footer>

  </div>

</div>
