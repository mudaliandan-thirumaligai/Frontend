<div class="fixed top-6 right-6 w-14 h-14 rounded-full bg-card shadow-soft
            flex items-center justify-center text-primary font-bold"
     [style.background]="
       'conic-gradient(var(--primary) ' + scrollPercent + '%, var(--muted) ' + scrollPercent + '%)'
     ">
  {{ scrollPercent | number:'1.0-0' }}%
</div>
<div class="min-h-screen xl:flex">
  <div>
    <app-sidebar></app-sidebar>
    <app-backdrop></app-backdrop>
  </div>
  <div
      class="flex-1 transition-all duration-300 ease-in-out"
      [ngClass]="{
        'xl:ml-[290px]': (isExpanded$ | async) || (isHovered$ | async),
        'xl:ml-[90px]': !(isExpanded$ | async) && !(isHovered$ | async),
        'ml-0': (isMobileOpen$ | async)
      }"
  >
    <!-- app header start -->
    <!-- <app-header/> -->
    <!-- app header end -->
    <div class="mx-auto max-w-(--breakpoint-2xl)">
      <router-outlet></router-outlet>
      <app-footer></app-footer>
    </div>
  </div>
</div>
