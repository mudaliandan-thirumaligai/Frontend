<!-- 🔹 Header -->
<div
  class="w-full py-4 px-6 bg-yellow-50 dark:bg-neutral-900 shadow-sm flex items-center fixed top-0 left-0 right-0 z-50"
  [ngClass]="(containerClasses$ | async) || []"
>
  <div class="text-3xl font-bold text-red-700 dark:text-red-400 whitespace-nowrap">
    Mudaliandan Swami Thirumaligai
  </div>

  <div class="flex-1 flex justify-center">
    <img src="images/mudaliandan/thiruman.png" alt="Logo" class="h-20 object-contain" />
  </div>
</div>

<br><br><br><br><br>

<!-- 🔹 Scroll Progress Indicator -->
<div class="fixed top-6 right-6 w-14 h-14 rounded-full bg-card shadow-soft
            flex items-center justify-center text-primary font-bold"
     [style.background]="
       'conic-gradient(var(--primary) ' + scrollPercent + '%, var(--muted) ' + scrollPercent + '%)'
     ">
  {{ scrollPercent | number:'1.0-0' }}%
</div>

<!-- 🔹 Main Wrapper -->
<div class="min-h-screen xl:flex">

  <!-- Only show Sidebar + Backdrop for ADMIN -->
  <div *ngIf="isAdmin$ | async">
    <app-sidebar-new></app-sidebar-new>
    <app-backdrop></app-backdrop>
  </div>

  <!-- 🔹 Main Content -->
  <div [ngClass]="(containerClasses$ | async) || []">
    <div class="mx-auto max-w-(--breakpoint-2xl)">
      <router-outlet></router-outlet>
      <app-footer></app-footer>
    </div>
  </div>

</div>
