<!-- admin-sidebar.component.html -->
<div
  class="h-screen w-64 sticky top-0
         bg-indigo-50 dark:bg-neutral-900
         shadow-md p-4"
>
  <div class="text-xl font-semibold text-indigo-800 dark:text-indigo-300 mb-6">
    Admin Panel
  </div>

  <ul class="space-y-3">
    <li *ngFor="let item of navItems">
      <button
        (click)="navigate(item)"
        class="w-full text-left px-3 py-2 rounded
               hover:bg-indigo-200 dark:hover:bg-neutral-800 transition"
      >
        {{ item.label }}
      </button>
    </li>
  </ul>
</div>
