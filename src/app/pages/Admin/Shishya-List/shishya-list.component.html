<app-page-breadcrumb pageTitle="Shishya List" />

<!-- ================= PAGE INTRO ================= -->
<section class="py-8 px-2">
  <div class="max-w-6xl mx-auto">

    <!-- Title (Left aligned) -->
    <h1 class="text-2xl md:text-3xl font-semibold text-indigo-900">
      Shishya List
    </h1>

  </div>
</section>

<!-- ================= CONTENT ================= -->
<section class="max-w-6xl mx-auto px-6 pb-16">

  <!-- 🔍 SEARCH & FILTER -->
  <div class="flex flex-col sm:flex-row gap-4 mb-6">

    <!-- Search -->
    <input
      type="text"
      placeholder="Search by name or email..."
      [(ngModel)]="searchTerm"
      (ngModelChange)="onSearchChange()"
      class="flex-1 px-4 py-2 rounded-lg
             border border-[#6379C8]/40 dark:border-[#5362A8]/40
             bg-white/10 dark:bg-[#1A1F2B]/60 backdrop-blur-sm
             text-indigo-700 dark:text-indigo-300
             placeholder-indigo-700/50 dark:placeholder-indigo-300/50
             font-medium tracking-wide
             focus:outline-none focus:ring-2 focus:ring-indigo-700
             transition"
    />

    <!-- Filter -->
    <select
      [(ngModel)]="selectedType"
      (ngModelChange)="onTypeChange()"
      class="w-full sm:w-48 px-4 py-2 rounded-lg
             border border-[#6379C8]/40 dark:border-[#5362A8]/40
             bg-white/10 dark:bg-[#1A1F2B]/60 backdrop-blur-sm
             text-indigo-700 dark:text-indigo-300
             font-medium tracking-wide
             focus:outline-none focus:ring-2 focus:ring-indigo-700
             transition"
    >
      <option value="all">All Types</option>
      <option value="shishya">Shishya</option>
      <option value="abhimani">Abhimani</option>
    </select>

  </div>

  <!-- 📋 TABLE CARD -->
  <div
    class="rounded-xl
          bg-indigo-50/60 dark:bg-indigo-950/20
          border border-indigo-200/60 dark:border-indigo-900
          shadow-sm overflow-x-auto"
  >
    <table class="w-full border-collapse text-left">

      <!-- TABLE HEADER -->
      <thead>
        <tr
          class="border-b border-indigo-200/60
                text-sm font-semibold
                text-indigo-700 dark:text-indigo-300"
        >
          <th class="py-4 px-4">Name</th>
          <th class="py-4 px-4">Type</th>
          <th class="py-4 px-4">Query</th>
          <th class="py-4 px-4 text-right">Actions</th>
        </tr>
      </thead>

      <!-- TABLE BODY -->
      <tbody>
        <tr
          *ngFor="let contact of contacts"
          class="border-b border-indigo-200/40
                hover:bg-indigo-100/40 dark:hover:bg-indigo-900/20
                transition text-sm"
        >
          <td class="py-3 px-4 font-medium text-indigo-900 dark:text-indigo-200">
            {{ contact.name }}
          </td>

          <td class="py-3 px-4 capitalize text-indigo-700 dark:text-indigo-300">
            {{ contact.type }}
          </td>

          <td class="py-3 px-4 text-indigo-600 dark:text-indigo-400">
            {{ contact.query || '—' }}
          </td>

          <td class="py-3 px-4 text-right space-x-3 whitespace-nowrap">
            <button
              class="text-indigo-600 hover:text-indigo-800 dark:text-indigo-400 dark:hover:text-indigo-300 hover:underline"
              (click)="viewContact(contact)"
            >
              View
            </button>

            <button
              class="text-indigo-500 hover:text-indigo-700 dark:text-indigo-400 dark:hover:text-indigo-300 hover:underline"
              (click)="editContact(contact)"
            >
              Edit
            </button>

            <button
              class="text-red-500 hover:text-red-600 hover:underline"
              (click)="deleteContact(contact._id)"
            >
              Delete
            </button>
          </td>
        </tr>

        <!-- EMPTY STATE -->
        <tr *ngIf="contacts.length === 0">
          <td
            colspan="4"
            class="py-10 text-center text-indigo-500"
          >
            No contacts found
          </td>
        </tr>
      </tbody>

    </table>
  </div>

  <!-- 🔢 PAGINATION -->
  <div
    *ngIf="totalPages >= 1"
    class="flex items-center justify-between mt-6
           text-sm text-indigo-600 dark:text-indigo-400"
  >
    <span>
      Page {{ currentPage }} of {{ totalPages }}
    </span>

    <div class="flex gap-2">
      <button
        class="btn-secondary"
        [disabled]="currentPage === 1"
        (click)="prevPage()"
      >
        Prev
      </button>

      <button
        class="btn-secondary"
        [disabled]="currentPage === totalPages"
        (click)="nextPage()"
      >
        Next
      </button>
    </div>
  </div>

</section>




<!-- SHISHYA DETAILS MODAL -->
<app-modal
  [isOpen]="isModalOpen"
  (close)="closeModal()"
  className="max-w-[600px] max-h-[95vh] overflow-hidden"
>
  <div
    *ngIf="selectedContact"
    class="flex flex-col px-6 py-6 overflow-y-auto custom-scrollbar max-h-[90vh] font-sans text-indigo-700 dark:text-indigo-300"
  >

    <!-- 🌸 HEADER -->
    <div class="sticky top-0 z-10 bg-white dark:bg-gray-900 px-6 py-4">
      <h5 class="font-semibold text-indigo-700 dark:text-indigo-300 text-xl lg:text-2xl">
        {{ isEditMode ? 'Edit Contact' : 'Contact Details' }}
      </h5>
    </div>

    <!-- 🌿 FORM FIELDS -->
    <div class="overflow-y-auto max-h-[75vh] px-6 py-4 space-y-6 custom-scrollbar">

      <!-- Name -->
      <div>
        <label class="block mb-1.5 text-sm font-medium text-indigo-600 dark:text-indigo-400">
          Name
        </label>
        <input
          type="text"
          [(ngModel)]="selectedContact.name"
          [readonly]="!isEditMode"
          class="w-full rounded-lg border border-gray-300 px-4 py-2.5 text-sm
                 text-indigo-700 dark:text-indigo-300
                 focus:outline-none focus:ring-2 focus:ring-indigo-500
                 dark:border-gray-700 dark:bg-gray-900
                 disabled:bg-gray-100"
        />
      </div>

      <!-- Type -->
      <div>
        <label class="block mb-1.5 text-sm font-medium text-indigo-600 dark:text-indigo-400">
          Type
        </label>
        <select
          [(ngModel)]="selectedContact.type"
          [disabled]="!isEditMode"
          class="w-full rounded-lg border border-gray-300 px-4 py-2.5 text-sm
                 text-indigo-700 dark:text-indigo-300
                 focus:outline-none focus:ring-2 focus:ring-indigo-500
                 dark:border-gray-700 dark:bg-gray-900"
        >
          <option value="shishya">Shishya</option>
          <option value="abhimani">Abhimani</option>
        </select>
      </div>

      <!-- Query -->
      <div>
        <label class="block mb-1.5 text-sm font-medium text-indigo-600 dark:text-indigo-400">
          Query
        </label>
        <textarea
          rows="3"
          [(ngModel)]="selectedContact.query"
          [readonly]="!isEditMode"
          class="w-full rounded-lg border border-gray-300 px-4 py-2.5 text-sm
                 text-indigo-700 dark:text-indigo-300 resize-none
                 focus:outline-none focus:ring-2 focus:ring-indigo-500
                 dark:border-gray-700 dark:bg-gray-900"
        ></textarea>
      </div>

      <!-- Email -->
      <div>
        <label class="block mb-1.5 text-sm font-medium text-indigo-600 dark:text-indigo-400">
          Email
        </label>
        <input
          type="email"
          [(ngModel)]="selectedContact.email"
          [readonly]="!isEditMode"
          class="w-full rounded-lg border border-gray-300 px-4 py-2.5 text-sm
                 text-indigo-700 dark:text-indigo-300
                 focus:outline-none focus:ring-2 focus:ring-indigo-500
                 dark:border-gray-700 dark:bg-gray-900"
        />
      </div>

      <!-- Mobile -->
      <div>
        <label class="block mb-1.5 text-sm font-medium text-indigo-600 dark:text-indigo-400">
          Mobile
        </label>
        <input
          type="text"
          [(ngModel)]="selectedContact.mobile"
          [readonly]="!isEditMode"
          class="w-full rounded-lg border border-gray-300 px-4 py-2.5 text-sm
                 text-indigo-700 dark:text-indigo-300
                 focus:outline-none focus:ring-2 focus:ring-indigo-500
                 dark:border-gray-700 dark:bg-gray-900"
        />
      </div>

      <!-- WhatsApp -->
      <div>
        <label class="block mb-1.5 text-sm font-medium text-indigo-600 dark:text-indigo-400">
          WhatsApp Number
        </label>
        <input
          type="text"
          [(ngModel)]="selectedContact.whatsappNumber"
          [readonly]="!isEditMode"
          class="w-full rounded-lg border border-gray-300 px-4 py-2.5 text-sm
                 text-indigo-700 dark:text-indigo-300
                 focus:outline-none focus:ring-2 focus:ring-indigo-500
                 dark:border-gray-700 dark:bg-gray-900"
        />
      </div>

      <!-- Postal Address -->
      <div>
        <label class="block mb-1.5 text-sm font-medium text-indigo-600 dark:text-indigo-400">
          Postal Address
        </label>
        <textarea
          rows="3"
          [(ngModel)]="selectedContact.postalAddress"
          [readonly]="!isEditMode"
          class="w-full rounded-lg border border-gray-300 px-4 py-2.5 text-sm
                 text-indigo-700 dark:text-indigo-300 resize-none
                 focus:outline-none focus:ring-2 focus:ring-indigo-500
                 dark:border-gray-700 dark:bg-gray-900"
        ></textarea>
      </div>

      <!-- Created At (Read-only text like Event Number) -->
      <div>
        <label class="block mb-1.5 text-sm font-medium text-indigo-600 dark:text-indigo-400">
          Created At
        </label>
        <input
          type="text"
          [value]="selectedContact.createdAt | date:'medium'"
          disabled
          class="w-full rounded-lg border border-gray-300 px-4 py-2.5
                 bg-gray-100 text-sm cursor-not-allowed"
        />
      </div>

    </div>

    <!-- FOOTER BUTTONS -->
    <div class="sticky bottom-0 z-10 bg-white dark:bg-gray-900 flex flex-col sm:flex-row items-center gap-3 mt-6 sm:justify-end px-6 py-4">

      <button
        type="button"
        (click)="closeModal()"
        class="w-full sm:w-auto px-4 py-2.5 rounded-lg border border-indigo-300
               text-indigo-700 dark:text-indigo-300
               hover:bg-indigo-50 dark:hover:bg-indigo-900"
      >
        Close
      </button>

      <button
        *ngIf="isEditMode"
        type="button"
        (click)="saveChanges()"
        class="w-full sm:w-auto px-4 py-2.5 rounded-lg bg-indigo-500 text-white hover:bg-indigo-600"
      >
        Save Changes
      </button>

    </div>

  </div>
</app-modal>
