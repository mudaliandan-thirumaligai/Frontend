<app-page-breadcrumb pageTitle="Shishya List" />
<!-- ================= Contact INTRO ================= -->
<h1 class="text-2xl md:text-3xl font-semibold text-indigo-900">Shishya List</h1>
<br>

<!-- SEARCH & FILTER BAR -->
<div class="flex flex-col sm:flex-row gap-3 mb-4">

  <input
    type="text"
    placeholder="Search by name or email..."
    class="input flex-1"
    [(ngModel)]="searchTerm"
    (ngModelChange)="onSearchChange()"
  />

  <select
    class="input w-full sm:w-48"
    [(ngModel)]="selectedType"
    (ngModelChange)="onTypeChange()"
  >
    <option value="all">All Types</option>
    <option value="shishya">Shishya</option>
    <option value="abhimani">Abhimani</option>
  </select>

</div>


<div class="rounded-2xl border bg-white p-6 shadow-sm">

  <table class="w-full border-collapse">
    <thead>
      <tr class="text-left border-b text-sm text-gray-600">
        <th class="py-3">Name</th>
        <th>Type</th>
        <th>Email</th>
        <th>Created</th>
        <th> Query</th>
        <th class="text-right">Actions</th>
      </tr>
    </thead>

    <tbody>
      <tr
        *ngFor="let contact of contacts"
        class="border-b hover:bg-gray-50 text-sm"
      >
        <td class="py-3 font-medium">{{ contact.name }}</td>
        <td class="capitalize">{{ contact.type }}</td>
        <td>{{ contact.email || '—' }}</td>
        <td>{{ contact.createdAt | date: 'short' }}</td>
        <td>{{ contact.query || '—' }}</td>


        <td class="text-right space-x-2">
          <!-- VIEW -->
          <button
            class="px-3 py-1 text-blue-600 hover:underline"
            (click)="viewContact(contact)"
          >
            View
          </button>

          <!-- EDIT -->
          <button
            class="px-3 py-1 text-indigo-600 hover:underline"
            (click)="editContact(contact)"
          >
            Edit
          </button>

          <!-- DELETE -->
          <button
            class="px-3 py-1 text-red-600 hover:underline"
            (click)="deleteContact(contact._id)"
          >
            Delete
          </button>
        </td>
      </tr>
    </tbody>
  </table>
</div>
<!-- PAGINATION -->
<div
  *ngIf="totalPages >= 1"
  class="flex items-center justify-between mt-4 text-sm"
>
  <span class="text-gray-600">
    Page {{ currentPage }} of {{ totalPages }}
  </span>

  <div class="flex gap-2">
    <button
      class="btn-secondary"
      [disabled]="currentPage === 1"
      (click)="prevPage()"
    >
      Prev
    </button>

    <button
      class="btn-secondary"
      [disabled]="currentPage === totalPages"
      (click)="nextPage()"
    >
      Next
    </button>
  </div>
</div>

<tr *ngIf="contacts.length === 0">
  <td colspan="5" class="py-6 text-center text-gray-500">
    No contacts found
  </td>
</tr>


<!-- SHISHYA DETAILS MODAL -->
<app-modal
  [isOpen]="isModalOpen"
  (close)="closeModal()"
  className="max-w-[600px] max-h-[95vh] overflow-hidden"
>
  <div
    *ngIf="selectedContact"
    class="flex flex-col px-6 py-6 overflow-y-auto custom-scrollbar max-h-[90vh] font-sans text-indigo-700 dark:text-indigo-300"
  >

    <!-- 🌸 HEADER -->
    <div class="sticky top-0 z-10 bg-white dark:bg-gray-900 px-6 py-4">
      <h5 class="font-semibold text-indigo-700 dark:text-indigo-300 text-xl lg:text-2xl">
        {{ isEditMode ? 'Edit Contact' : 'Contact Details' }}
      </h5>
    </div>

    <!-- 🌿 FORM FIELDS -->
    <div class="overflow-y-auto max-h-[75vh] px-6 py-4 space-y-6 custom-scrollbar">

      <!-- Name -->
      <div>
        <label class="block mb-1.5 text-sm font-medium text-indigo-600 dark:text-indigo-400">
          Name
        </label>
        <input
          type="text"
          [(ngModel)]="selectedContact.name"
          [readonly]="!isEditMode"
          class="w-full rounded-lg border border-gray-300 px-4 py-2.5 text-sm
                 text-indigo-700 dark:text-indigo-300
                 focus:outline-none focus:ring-2 focus:ring-indigo-500
                 dark:border-gray-700 dark:bg-gray-900
                 disabled:bg-gray-100"
        />
      </div>

      <!-- Type -->
      <div>
        <label class="block mb-1.5 text-sm font-medium text-indigo-600 dark:text-indigo-400">
          Type
        </label>
        <select
          [(ngModel)]="selectedContact.type"
          [disabled]="!isEditMode"
          class="w-full rounded-lg border border-gray-300 px-4 py-2.5 text-sm
                 text-indigo-700 dark:text-indigo-300
                 focus:outline-none focus:ring-2 focus:ring-indigo-500
                 dark:border-gray-700 dark:bg-gray-900"
        >
          <option value="shishya">Shishya</option>
          <option value="abhimani">Abhimani</option>
        </select>
      </div>

      <!-- Query -->
      <div>
        <label class="block mb-1.5 text-sm font-medium text-indigo-600 dark:text-indigo-400">
          Query
        </label>
        <textarea
          rows="3"
          [(ngModel)]="selectedContact.query"
          [readonly]="!isEditMode"
          class="w-full rounded-lg border border-gray-300 px-4 py-2.5 text-sm
                 text-indigo-700 dark:text-indigo-300 resize-none
                 focus:outline-none focus:ring-2 focus:ring-indigo-500
                 dark:border-gray-700 dark:bg-gray-900"
        ></textarea>
      </div>

      <!-- Email -->
      <div>
        <label class="block mb-1.5 text-sm font-medium text-indigo-600 dark:text-indigo-400">
          Email
        </label>
        <input
          type="email"
          [(ngModel)]="selectedContact.email"
          [readonly]="!isEditMode"
          class="w-full rounded-lg border border-gray-300 px-4 py-2.5 text-sm
                 text-indigo-700 dark:text-indigo-300
                 focus:outline-none focus:ring-2 focus:ring-indigo-500
                 dark:border-gray-700 dark:bg-gray-900"
        />
      </div>

      <!-- Mobile -->
      <div>
        <label class="block mb-1.5 text-sm font-medium text-indigo-600 dark:text-indigo-400">
          Mobile
        </label>
        <input
          type="text"
          [(ngModel)]="selectedContact.mobile"
          [readonly]="!isEditMode"
          class="w-full rounded-lg border border-gray-300 px-4 py-2.5 text-sm
                 text-indigo-700 dark:text-indigo-300
                 focus:outline-none focus:ring-2 focus:ring-indigo-500
                 dark:border-gray-700 dark:bg-gray-900"
        />
      </div>

      <!-- WhatsApp -->
      <div>
        <label class="block mb-1.5 text-sm font-medium text-indigo-600 dark:text-indigo-400">
          WhatsApp Number
        </label>
        <input
          type="text"
          [(ngModel)]="selectedContact.whatsappNumber"
          [readonly]="!isEditMode"
          class="w-full rounded-lg border border-gray-300 px-4 py-2.5 text-sm
                 text-indigo-700 dark:text-indigo-300
                 focus:outline-none focus:ring-2 focus:ring-indigo-500
                 dark:border-gray-700 dark:bg-gray-900"
        />
      </div>

      <!-- Postal Address -->
      <div>
        <label class="block mb-1.5 text-sm font-medium text-indigo-600 dark:text-indigo-400">
          Postal Address
        </label>
        <textarea
          rows="3"
          [(ngModel)]="selectedContact.postalAddress"
          [readonly]="!isEditMode"
          class="w-full rounded-lg border border-gray-300 px-4 py-2.5 text-sm
                 text-indigo-700 dark:text-indigo-300 resize-none
                 focus:outline-none focus:ring-2 focus:ring-indigo-500
                 dark:border-gray-700 dark:bg-gray-900"
        ></textarea>
      </div>

      <!-- Created At (Read-only text like Event Number) -->
      <div>
        <label class="block mb-1.5 text-sm font-medium text-indigo-600 dark:text-indigo-400">
          Created At
        </label>
        <input
          type="text"
          [value]="selectedContact.createdAt | date:'medium'"
          disabled
          class="w-full rounded-lg border border-gray-300 px-4 py-2.5
                 bg-gray-100 text-sm cursor-not-allowed"
        />
      </div>

    </div>

    <!-- FOOTER BUTTONS -->
    <div class="sticky bottom-0 z-10 bg-white dark:bg-gray-900 flex flex-col sm:flex-row items-center gap-3 mt-6 sm:justify-end px-6 py-4">

      <button
        type="button"
        (click)="closeModal()"
        class="w-full sm:w-auto px-4 py-2.5 rounded-lg border border-indigo-300
               text-indigo-700 dark:text-indigo-300
               hover:bg-indigo-50 dark:hover:bg-indigo-900"
      >
        Close
      </button>

      <button
        *ngIf="isEditMode"
        type="button"
        (click)="saveChanges()"
        class="w-full sm:w-auto px-4 py-2.5 rounded-lg bg-indigo-500 text-white hover:bg-indigo-600"
      >
        Save Changes
      </button>

    </div>

  </div>
</app-modal>
