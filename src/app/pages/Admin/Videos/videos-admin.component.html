<app-page-breadcrumb pageTitle="Admin Videos"></app-page-breadcrumb>

<section class="px-4 py-4 max-w-6xl mx-auto">

  <!-- Header + Add Button -->
  <div class="flex justify-between items-center my-4">
    <h1 class="text-2xl md:text-3xl font-semibold text-indigo-900">Videos Management</h1>
    <button
      (click)="startAddNewVideo()"
      type="button"
      class="inline-flex items-center text-indigo-700 font-medium
             hover:text-indigo-900 transition
             px-6 py-3 rounded-lg
             border border-indigo-300 dark:border-indigo-700
             focus:outline-none focus:ring-2 focus:ring-indigo-300/40">
      + Add New Video
    </button>
  </div>

  <!-- Add New Video Form -->
  <div *ngIf="addingNewVideo" class="my-4 p-4 border rounded-lg bg-white/10 dark:bg-[#1A1F2B]/60 backdrop-blur-sm">
    <h3 class="font-medium text-indigo-700 mb-2">New Video Details</h3>
    
    <div class="space-y-3">
      <input type="text" [(ngModel)]="newVideoData.eventName" placeholder="Event Name"
             class="w-full px-4 py-2 rounded-lg border border-indigo-300 dark:border-indigo-700
                    bg-white/10 dark:bg-[#1A1F2B]/60 text-indigo-700 dark:text-indigo-300
                    focus:outline-none focus:ring-2 focus:ring-indigo-700 transition"/>

      <input type="text" [(ngModel)]="newVideoData.description" placeholder="Description"
             class="w-full px-4 py-2 rounded-lg border border-indigo-300 dark:border-indigo-700
                    bg-white/10 dark:bg-[#1A1F2B]/60 text-indigo-700 dark:text-indigo-300
                    focus:outline-none focus:ring-2 focus:ring-indigo-700 transition"/>

      <input type="text" [(ngModel)]="newVideoData.youtubeLink" placeholder="YouTube Link"
             class="w-full px-4 py-2 rounded-lg border border-indigo-300 dark:border-indigo-700
                    bg-white/10 dark:bg-[#1A1F2B]/60 text-indigo-700 dark:text-indigo-300
                    focus:outline-none focus:ring-2 focus:ring-indigo-700 transition"/>
    </div>

    <div class="flex gap-2 mt-3">
      <button (click)="saveNewVideo()" type="button"
              class="inline-flex items-center text-indigo-700 font-medium
                     hover:text-indigo-900 transition
                     px-6 py-3 rounded-lg
                     border border-indigo-300 dark:border-indigo-700
                     focus:outline-none focus:ring-2 focus:ring-indigo-300/40">
        Submit →
      </button>
      <button (click)="cancelAddNewVideo()" type="button"
              class="inline-flex items-center text-indigo-700 font-medium
                     hover:text-indigo-900 transition
                     px-6 py-3 rounded-lg
                     border border-indigo-300 dark:border-indigo-700
                     focus:outline-none focus:ring-2 focus:ring-indigo-300/40">
        Cancel
      </button>
    </div>
  </div>

  <!-- Search Box -->
  <div class="my-4">
    <input
      type="text"
      placeholder="Search by event name or description..."
      [(ngModel)]="searchTerm"
      class="w-full px-4 py-2 rounded-lg
             border border-[#6379C8]/40 dark:border-[#5362A8]/40
             bg-white/10 dark:bg-[#1A1F2B]/60 backdrop-blur-sm
             text-indigo-700 dark:text-indigo-300
             placeholder-indigo-700/50 dark:placeholder-indigo-300/50
             font-medium tracking-wide leading-tight
             focus:outline-none focus:ring-2 focus:ring-indigo-700
             transition"
    />
  </div>

  <!-- Videos Table -->
  <table class="w-full border border-gray-300 rounded-lg text-indigo-700 dark:text-indigo-300">
    <thead class="bg-gray-100 dark:bg-[#1A1F2B]/40">
      <tr>
        <th class="p-3 border">Event Name</th>
        <th class="p-3 border">Description</th>
        <th class="p-3 border">YouTube Link</th>
        <th class="p-3 border">Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let video of filteredVideos" class="hover:bg-indigo-50 dark:hover:bg-white/[0.05] transition">

        <!-- Event Name -->
        <td class="p-2 border">
          <span *ngIf="editingVideoId !== video._id">{{ video.eventName }}</span>
          <input *ngIf="editingVideoId === video._id"
                 type="text"
                 [(ngModel)]="editedData.eventName"
                 class="w-full px-2 py-1 rounded-lg border border-[#6379C8]/40 dark:border-[#5362A8]/40
                        bg-white/10 dark:bg-[#1A1F2B]/60 text-indigo-700 dark:text-indigo-300
                        placeholder-indigo-700/50 dark:placeholder-indigo-300/50
                        font-medium focus:outline-none focus:ring-2 focus:ring-indigo-700 transition"/>
        </td>

        <!-- Description -->
        <td class="p-2 border">
          <span *ngIf="editingVideoId !== video._id">{{ video.description }}</span>
          <input *ngIf="editingVideoId === video._id"
                 type="text"
                 [(ngModel)]="editedData.description"
                 class="w-full px-2 py-1 rounded-lg border border-[#6379C8]/40 dark:border-[#5362A8]/40
                        bg-white/10 dark:bg-[#1A1F2B]/60 text-indigo-700 dark:text-indigo-300
                        placeholder-indigo-700/50 dark:placeholder-indigo-300/50
                        font-medium focus:outline-none focus:ring-2 focus:ring-indigo-700 transition"/>
        </td>

        <!-- YouTube Link -->
        <td class="p-2 border">
          <span *ngIf="editingVideoId !== video._id">{{ video.youtubeLink }}</span>
          <input *ngIf="editingVideoId === video._id"
                 type="text"
                 [(ngModel)]="editedData.youtubeLink"
                 class="w-full px-2 py-1 rounded-lg border border-[#6379C8]/40 dark:border-[#5362A8]/40
                        bg-white/10 dark:bg-[#1A1F2B]/60 text-indigo-700 dark:text-indigo-300
                        placeholder-indigo-700/50 dark:placeholder-indigo-300/50
                        font-medium focus:outline-none focus:ring-2 focus:ring-indigo-700 transition"/>
        </td>

        <!-- Actions -->
        <td class="p-2 border flex gap-2 flex-wrap">
          <!-- Edit -->
          <button *ngIf="editingVideoId !== video._id"
                  (click)="startEdit(video)"
                  type="button"
                  class="inline-flex items-center text-indigo-700 font-medium
                         hover:text-indigo-900 transition
                         px-6 py-3 rounded-lg
                         border border-indigo-300 dark:border-indigo-700
                         focus:outline-none focus:ring-2 focus:ring-indigo-300/40">
            Edit 
          </button>

          <!-- Save -->
          <button *ngIf="editingVideoId === video._id"
                  (click)="saveEdit()"
                  type="button"
                  class="inline-flex items-center text-indigo-700 font-medium
                         hover:text-indigo-900 transition
                         px-6 py-3 rounded-lg
                         border border-indigo-300 dark:border-indigo-700
                         focus:outline-none focus:ring-2 focus:ring-indigo-300/40">
            Save 
          </button>

          <!-- Cancel -->
          <button *ngIf="editingVideoId === video._id"
                  (click)="cancelEdit()"
                  type="button"
                  class="inline-flex items-center text-indigo-700 font-medium
                         hover:text-indigo-900 transition
                         px-6 py-3 rounded-lg
                         border border-indigo-300 dark:border-indigo-700
                         focus:outline-none focus:ring-2 focus:ring-indigo-300/40">
            Cancel 
          </button>

          <!-- Delete -->
          <button (click)="deleteVideo(video)"
                  type="button"
                  class="inline-flex items-center text-indigo-700 font-medium
                         hover:text-indigo-900 transition
                         px-6 py-3 rounded-lg
                         border border-indigo-300 dark:border-indigo-700
                         focus:outline-none focus:ring-2 focus:ring-indigo-300/40">
            Delete 
          </button>
        </td>

      </tr>
    </tbody>
  </table>
</section>
