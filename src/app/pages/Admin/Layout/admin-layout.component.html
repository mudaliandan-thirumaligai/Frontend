<!-- 🔐 ADMIN LAYOUT -->
<div class="min-h-screen flex bg-gray-50 dark:bg-neutral-900">

  <!-- Sidebar -->
  <app-admin-sidebar
    [isOpen]="sidebarOpen"
    (closeSidebar)="sidebarOpen = false">
  </app-admin-sidebar>

  <!-- RIGHT CONTENT -->
  <div class="flex-1 overflow-y-auto">

    <!-- Mobile Topbar -->
    <div class="lg:hidden p-4 border-b dark:border-gray-700 flex items-center">
      <button
        (click)="sidebarOpen = true"
        class="text-indigo-700 dark:text-indigo-300 text-2xl"
      >
        ☰
      </button>
    </div>

    <div class="p-6">
      <router-outlet></router-outlet>
    </div>

  </div>

</div>
