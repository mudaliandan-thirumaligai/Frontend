<div class="rounded-2xl border border-gray-200 bg-white dark:border-gray-800 dark:bg-white/[0.03]">
  <div class="custom-calendar">
    <full-calendar #calendar [options]="calendarOptions"></full-calendar>
  </div>

  <app-modal
    [isOpen]="isOpen"
    (close)="closeModal()"
    className="max-w-[600px] max-h-[95vh] overflow-hidden"
  >
    <div class="flex flex-col px-6 py-6 overflow-y-auto custom-scrollbar max-h-[90vh] font-sans text-indigo-700 dark:text-indigo-300">
      
      <!-- 🌸 HEADER -->
      <div class="sticky top-0 z-10 bg-white dark:bg-gray-900 px-6 py-4">
        <h5 class="font-semibold text-indigo-700 dark:text-indigo-300 text-xl lg:text-2xl">
          {{ selectedEvent ? 'Edit Event' : 'Add Event' }}
        </h5>
      </div>

      <!-- 🌿 FORM FIELDS -->
      <div class="overflow-y-auto max-h-[75vh] px-6 py-4 space-y-6 custom-scrollbar">
        <!-- Event Name -->
        <div>
          <label class="block mb-1.5 text-sm font-medium text-indigo-600 dark:text-indigo-400">
            Event Name
          </label>
          <input
            type="text"
            [(ngModel)]="eventTitle"
            class="w-full rounded-lg border border-gray-300 px-4 py-2.5 text-sm text-indigo-700 dark:text-indigo-300 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 dark:border-gray-700 dark:bg-gray-900 dark:placeholder:text-gray-400"
          />
        </div>

        <!-- Event Number (readonly) -->
        <div *ngIf="selectedEvent">
          <label class="block mb-1.5 text-sm font-medium text-indigo-600 dark:text-indigo-400">
            Event Number
          </label>
          <input
            type="text"
            [value]="eventNumber"
            disabled
            class="w-full rounded-lg border border-gray-300 px-4 py-2.5 bg-gray-100 text-sm cursor-not-allowed"
          />
        </div>

        <!-- Description -->
        <div>
          <label class="block mb-1.5 text-sm font-medium text-indigo-600 dark:text-indigo-400">
            Description
          </label>
          <textarea
            rows="3"
            [(ngModel)]="eventDescription"
            class="w-full rounded-lg border border-gray-300 px-4 py-2.5 text-sm text-indigo-700 dark:text-indigo-300 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 dark:border-gray-700 dark:bg-gray-900 dark:placeholder:text-gray-400"
          ></textarea>
        </div>

        <!-- Location -->
        <div>
          <label class="block mb-1.5 text-sm font-medium text-indigo-600 dark:text-indigo-400">
            Location
          </label>
          <input
            type="text"
            [(ngModel)]="eventLocation"
            class="w-full rounded-lg border border-gray-300 px-4 py-2.5 text-sm text-indigo-700 dark:text-indigo-300 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 dark:border-gray-700 dark:bg-gray-900 dark:placeholder:text-gray-400"
          />
        </div>

        <!-- Tamil Year / Month -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label class="block mb-1.5 text-sm font-medium text-indigo-600 dark:text-indigo-400">
              Tamil Year
            </label>
            <input
              type="text"
              [(ngModel)]="eventTamilYear"
              class="w-full rounded-lg border border-gray-300 px-4 py-2.5 text-sm text-indigo-700 dark:text-indigo-300 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 dark:border-gray-700 dark:bg-gray-900 dark:placeholder:text-gray-400"
            />
          </div>
          <div>
            <label class="block mb-1.5 text-sm font-medium text-indigo-600 dark:text-indigo-400">
              Tamil Month
            </label>
            <input
              type="text"
              [(ngModel)]="eventTamilMonth"
              class="w-full rounded-lg border border-gray-300 px-4 py-2.5 text-sm text-indigo-700 dark:text-indigo-300 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 dark:border-gray-700 dark:bg-gray-900 dark:placeholder:text-gray-400"
            />
          </div>
          <!-- Google Drive Link -->
          <div>
            <label class="block mb-1.5 text-sm font-medium text-indigo-600 dark:text-indigo-400">
              Google Drive Link
            </label>
            <input
              type="url"
              [(ngModel)]="eventGoogleDriveLink"
              class="w-full rounded-lg border border-gray-300 px-4 py-2.5 text-sm text-indigo-700 dark:text-indigo-300 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 dark:border-gray-700 dark:bg-gray-900 dark:placeholder:text-gray-400"
            />
          </div>

        </div>

        <!-- Event Color Radio Buttons -->
        <div>
          <label class="block mb-2 text-sm font-medium text-indigo-600 dark:text-indigo-400">
            Event Color
          </label>
          <div class="flex flex-wrap items-center gap-4">
            <div *ngFor="let entry of (calendarsEvents | keyvalue)">
              <label
                  class="flex items-center text-sm text-indigo-700 dark:text-indigo-300 cursor-pointer select-none"
                  (click)="eventLevel = entry.key"
                >
                <input
                  type="radio"
                  name="event-level"
                  [(ngModel)]="eventLevel"
                  [value]="entry.key"
                  class="absolute opacity-0 w-5 h-5 cursor-pointer"
                />
                <span
                  class="w-5 h-5 mr-2 border border-gray-300 rounded-full flex items-center justify-center dark:border-gray-700"
                >
                  <span
                    class="w-2 h-2 rounded-full"
                    [ngClass]="{
                      'bg-red-500': entry.key === 'utsavam',
                      'bg-green-500': entry.key === 'thirunakchathiram',
                      'bg-blue-500': entry.key === 'theerthem',
                      'bg-yellow-500': entry.key === 'others'
                    }"
                    [class.block]="eventLevel === entry.key"
                    [class.hidden]="eventLevel !== entry.key">
                  </span>
                </span>
                {{ entry.key }}
              </label>

            </div>
          </div>
        </div>

        <!-- Start / End Date -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label class="block mb-1.5 text-sm font-medium text-indigo-600 dark:text-indigo-400">
              Start Date
            </label>
            <input
              type="date"
              [(ngModel)]="eventStartDate"
              class="w-full rounded-lg border border-gray-300 px-4 py-2.5 text-sm text-indigo-700 dark:text-indigo-300 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 dark:border-gray-700 dark:bg-gray-900"
            />
          </div>
          <div>
            <label class="block mb-1.5 text-sm font-medium text-indigo-600 dark:text-indigo-400">
              End Date
            </label>
            <input
              type="date"
              [(ngModel)]="eventEndDate"
              class="w-full rounded-lg border border-gray-300 px-4 py-2.5 text-sm text-indigo-700 dark:text-indigo-300 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 dark:border-gray-700 dark:bg-gray-900"
            />
          </div>
        </div>
      </div>

      <!-- Footer Buttons -->
      <div class="sticky bottom-0 z-10 bg-white dark:bg-gray-900 flex flex-col sm:flex-row items-center gap-3 mt-6 sm:justify-end px-6 py-4">
        <button
          type="button"
          (click)="closeModal()"
          class="w-full sm:w-auto px-4 py-2.5 rounded-lg border border-indigo-300 text-indigo-700 dark:text-indigo-300 hover:bg-indigo-50 dark:hover:bg-indigo-900"
        >
          Close
        </button>

        <button
          *ngIf="selectedEvent"
          type="button"
          (click)="handleDeleteEvent()"
          class="w-full sm:w-auto px-4 py-2.5 rounded-lg bg-indigo-600 text-white hover:bg-indigo-700"
        >
          Delete
        </button>

        <button
          type="button"
          (click)="handleAddOrUpdateEvent()"
          class="w-full sm:w-auto px-4 py-2.5 rounded-lg bg-indigo-500 text-white hover:bg-indigo-600"
        >
          {{ selectedEvent ? 'Update Changes' : 'Add Event' }}
        </button>
      </div>

    </div>
  </app-modal>


</div>
