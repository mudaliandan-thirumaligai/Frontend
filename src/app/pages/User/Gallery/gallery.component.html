<app-page-breadcrumb pageTitle="Gallery" />

<!-- ================= GALLERY INTRO ================= -->
<section class="py-8 px-2">
  <div class="max-w-6xl mx-auto text-center">
    <h1 class="text-2xl md:text-3xl font-semibold text-indigo-900">
      Gallery
    </h1>

    <p class="mt-3 text-indigo-600 max-w-2xl mx-auto">
      Explore spiritual archives and utsavam memories, organized clearly for easy browsing.
    </p>

    <div class="w-12 h-1 bg-indigo-300 mx-auto mt-4 rounded-full"></div>
  </div>
</section>

<!-- ================= GALLERY LAYOUT ================= -->
<div class="gallery-container">

  <!-- ================= MAIN CONTENT ================= -->
  <div class="gallery-content">

    <div
      *ngFor="let folder of folders; let i = index"
      class="folder-section"
      [id]="'folder-' + i"
    >

      <!-- Folder Header -->
      <h2
        class="folder-title flex justify-between items-center
               text-lg font-medium text-indigo-700
               cursor-pointer mt-4 pb-2 border-b border-gray-200"
        tabindex="0"
        role="button"
        [attr.aria-expanded]="folder.expanded"
        (click)="toggleFolder(folder)"
        (keydown.enter)="toggleFolder(folder)"
        (keydown.space)="toggleFolder(folder)"
      >
        <span>
          {{ folder.name }}
          <span class="text-sm text-indigo-500 ml-2">
            ({{ folder.images.length }} images)
          </span>
        </span>

        <span class="arrow" [class.open]="folder.expanded">▼</span>
      </h2>

      <!-- Image Grid -->
      <div class="grid fade" *ngIf="folder.expanded">
        <div
          class="grid-item"
          *ngFor="let img of folder.images; trackBy: trackByImg"
        >
          <img
            [src]="img"
            [alt]="folder.name + ' image'"
            loading="lazy"
            class="cursor-pointer"
            (click)="openImage(img, folder)"
          />
        </div>
      </div>

    </div>
  </div>

  <!-- ================= SIDEBAR ================= -->
  <aside class="sidebar">
  <h3 class="text-indigo-700 font-medium mb-3">
    Utsavams
  </h3>

  <!-- YEAR FILTER -->
  <div class="mb-4">
    <label class="block text-sm text-indigo-600 mb-1">
      Filter by year
    </label>
    <select
      class="year-select"
      #yearSelect
      (change)="onYearChange(yearSelect.value)"
    >
      <option value="">All years</option>
      <option *ngFor="let y of years" [value]="y">
        {{ y }}
      </option>
    </select>
  </div>

  <ul class="space-y-1">
    <li
      *ngFor="let folder of folders; let i = index"
      class="px-3 py-2 flex justify-between items-center
             text-indigo-700 hover:bg-gray-100 cursor-pointer rounded-md"
      [class.active-folder]="folder.expanded"
      (click)="scrollToFolder(folder)"
    >
      <span>{{ folder.name }}</span>
      <span class="count">{{ folder.images.length }}</span>
    </li>
  </ul>
</aside>


<!-- ================= IMAGE MODAL ================= -->
<div
  *ngIf="selectedImage"
  class="fixed inset-0 bg-black bg-opacity-70
         flex justify-center items-center z-50 touch-none modal-enter"
>

  <div class="relative">

    <!-- Image -->
    <img
      [src]="selectedImage"
      class="max-h-[90vh] max-w-[90vw]
             rounded-lg shadow-2xl select-none"
      (touchstart)="onTouchStart($event)"
      (touchend)="onTouchEnd($event)"
    />

    <!-- Image Counter -->
    <div
      class="absolute bottom-3 left-1/2 -translate-x-1/2
             text-indigo-700 font-medium mb-3"
    >
      {{ currentIndex + 1 }} / {{ currentFolder?.images.length }}
    </div>

    <!-- Close Button -->
    <button
      (click)="closeImage()"
      aria-label="Close image"
      class="absolute top-2 right-2
             text-white bg-black/60 rounded-full
             px-3 py-1 text-lg"
    >
      ✕
    </button>
  </div>
</div>
