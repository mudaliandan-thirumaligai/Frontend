<br>
<app-page-breadcrumb pageTitle="Videos" />

<!-- ================= VIDEOS INTRO ================= -->
<section class="py-8 px-2">
  <div class="max-w-6xl mx-auto text-center">

    <!-- Title -->
    <h1 class="text-2xl md:text-3xl font-semibold text-indigo-900">
      Videos
    </h1>

    <!-- Subtitle -->
    <p class="mt-3 text-indigo-600 max-w-2xl mx-auto">
      Watch spiritual discourses, past events, and devotional programs from Sri Mudaliandan Swami Thirumaligai. Explore these videos to relive moments of devotion and learning.
    </p>

    <!-- Divider -->
    <div class="w-12 h-1 bg-indigo-300 mx-auto mt-4 rounded-full"></div>

  </div>
</section>

<!-- 🎥 VIDEO GRID -->
<section class="max-w-6xl mx-auto px-6 pb-16 grid grid-cols-1 md:grid-cols-2 gap-6">

  <div *ngFor="let video of videos"
       (click)="openVideo(video)"
       class="group cursor-pointer rounded-xl
              bg-indigo-50 dark:bg-indigo-950/20
              border border-indigo-100 dark:border-indigo-900
              shadow-sm hover:shadow-md
              transition-all duration-300">

    <!-- Thumbnail -->
    <div class="relative h-44 rounded-t-xl
                bg-gradient-to-br from-sky-200 to-blue-100
                dark:from-indigo-900 dark:to-neutral-800
                flex items-center justify-center">

      <div class="w-14 h-14 rounded-full
                  bg-blue-900 dark:bg-blue-400
                  flex items-center justify-center
                  text-white text-xl font-bold
                  group-hover:scale-110 transition">
        ▶
      </div>
    </div>


    <!-- Info -->
    <div class="p-4">
      <h3 class="text-base md:text-lg font-bold text-blue-900 dark:text-blue-400">
        {{ video.title }}
      </h3>

      <p class="mt-2 text-sm md:text-base text-indigo-700 dark:text-indigo-300 leading-relaxed">
        {{ video.description }}
      </p>
    </div>

  </div>

</section>

<!-- 🌑 POPUP MODAL -->
<div class="video-modal" *ngIf="selectedVideo">
  <div class="overlay" (click)="closeVideo()"></div>

  <div class="modal-content rounded-xl shadow-lg">
    <button class="close-btn" (click)="closeVideo()">✕</button>

    <iframe [src]="selectedVideo"
            allowfullscreen
            class="w-full h-96 md:h-[500px] rounded-lg">
    </iframe>
  </div>
</div>
