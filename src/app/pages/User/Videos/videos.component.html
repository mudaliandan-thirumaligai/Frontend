<br><br><br>
<app-page-breadcrumb pageTitle="Videos" />
<!-- 🔹 PAGE HEADER (MATCH NAVBAR THEME) -->
<!-- 🔹 PAGE TITLE (MINIMAL & ALIGNED) -->
<div class="pt-4 pb-6 px-6 max-w-6xl mx-auto">
  <h1
    class="text-xl md:text-2xl font-semibold
           text-indigo-700 dark:text-indigo-300
           tracking-wide">
    Videos
  </h1>
</div>


<!-- 🎥 VIDEO GRID -->
<section
  class="max-w-6xl mx-auto px-6 pb-16
         grid grid-cols-1 md:grid-cols-2 gap-6">

  <div
    *ngFor="let video of videos"
    (click)="openVideo(video)"
    class="group cursor-pointer rounded-2xl
           bg-white dark:bg-neutral-900
           shadow-sm hover:shadow-md
           transition-all duration-300">

    <!-- Thumbnail -->
    <div
      class="relative h-44 rounded-t-2xl
             bg-gradient-to-br from-sky-200 to-blue-100
             dark:from-indigo-900 dark:to-neutral-800
             flex items-center justify-center">

      <div
        class="w-14 h-14 rounded-full
               bg-indigo-700/90 dark:bg-indigo-500
               flex items-center justify-center
               text-white text-xl
               group-hover:scale-110 transition">
        ▶
      </div>
    </div>

    <!-- Info -->
    <div class="p-4">
      <h3
        class="text-sm md:text-base font-semibold
               text-indigo-700 dark:text-indigo-300">
        {{ video.title }}
      </h3>

      <p
        class="mt-1 text-xs md:text-sm
               text-slate-600 dark:text-slate-400">
        {{ video.description }}
      </p>
    </div>

  </div>

</section>


<!-- 🌑 POPUP MODAL -->
<div class="video-modal" *ngIf="selectedVideo">
  <div class="overlay" (click)="closeVideo()"></div>

  <div class="modal-content">
    <button class="close-btn" (click)="closeVideo()">✕</button>

    <iframe
      [src]="selectedVideo"
      allowfullscreen>
    </iframe>
  </div>
</div>
