<app-page-breadcrumb pageTitle="Thirumaaligai Thaniyans" />

<section class="min-h-screen bg-linear-to-b from-gray-50 to-white dark:from-gray-950 dark:to-gray-900 pb-20">

  <!-- Header -->
  <div class="max-w-5xl mx-auto text-center py-10 px-2">
    <h1 class="text-2xl md:text-3xl font-semibold text-indigo-900 dark:text-white">
      Thirumaligai Thaniyans
    </h1>
  </div>

  <!-- Cards -->
  <div class="max-w-5xl mx-auto grid gap-8 px-2 card-grid">

    <div
      *ngFor="let item of thaniyans"
      class="group relative overflow-hidden rounded-3xl bg-white p-8 shadow-sm border border-gray-100 
      dark:bg-white/[0.03] dark:border-white/5 transition-all hover:shadow-xl hover:border-brand-500/30
      card reveal-card">

      <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-6">

        <h3 class="text-2xl font-bold text-gray-900 dark:text-white group-hover:text-brand-600 transition-colors">
          {{ item.id }}) {{ item.title }}
        </h3>

        <span *ngIf="item.nakshatram"
          class="inline-flex items-center rounded-full bg-brand-50 px-4 py-1.5 text-xs font-black uppercase tracking-widest text-brand-600 
          dark:bg-brand-500/10 dark:text-brand-400 shadow-xs">
          {{ item.nakshatram }}
        </span>

      </div>

      <div class="prose prose-lg dark:prose-invert max-w-none">
        <p class="font-serif italic leading-loose text-gray-700 dark:text-gray-300 whitespace-pre-line">
          {{ item.content }}
        </p>
      </div>

    </div>

  </div>

</section>
