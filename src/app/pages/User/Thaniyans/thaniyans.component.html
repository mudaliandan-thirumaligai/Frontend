<app-page-breadcrumb pageTitle="Thirumaaligai Thaniyans" />

<!-- ================= INTRO ================= -->
<section class="py-8 px-2">
  <div class="max-w-5xl mx-auto text-center">

    <h1 class="text-2xl md:text-3xl font-semibold text-indigo-900">
      Thirumaaligai Thaniyans
    </h1>

    <div class="w-12 h-1 bg-indigo-300 mx-auto mt-4 rounded-full"></div>

  </div>
</section>

<!-- ================= CONTENT ================= -->
<section class="py-8 px-4">
  <div class="max-w-6xl mx-auto grid gap-8 card-grid">

    <div
      *ngFor="let item of thaniyans"
      class="bg-white dark:bg-white/[0.03] rounded-3xl shadow-lg
             border border-gray-100 dark:border-white/5
             overflow-hidden transition-all hover:shadow-2xl
             animate-card"
    >
      <div class="relative">
        <div class="absolute top-0 left-0 right-0 h-2 bg-gradient-to-r from-indigo-500 to-indigo-500"></div>

        <div class="p-6 md:p-8">

          <!-- Header -->
          <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-6">

            <div>
              <h3 class="text-xl md:text-2xl font-bold text-indigo-900 dark:text-white">
                {{ item.id }} -  {{ item.title }}
              </h3>
            </div>

            <span
              *ngIf="item.nakshatram"
              class="inline-flex items-center rounded-full
                     bg-indigo-100 dark:bg-brand-500/10
                     px-4 py-2 text-xs font-semibold uppercase tracking-wider
                     text-indigo-700 dark:text-brand-400">
              {{ item.nakshatram }}
            </span>

          </div>

          <!-- Divider -->
          <div class="w-16 h-0.5 bg-indigo-200 dark:bg-white/10 mb-6"></div>

          <!-- Content -->
          <p class="font-serif italic leading-loose
                    text-gray-700 dark:text-gray-300
                    whitespace-pre-line text-base md:text-lg">
            {{ item.content }}
          </p>

        </div>
      </div>
    </div>

  </div>
</section>
