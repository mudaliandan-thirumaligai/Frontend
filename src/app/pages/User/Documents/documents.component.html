<app-page-breadcrumb pageTitle="Documents" />

<!-- ================= PAGE INTRO ================= -->
<section class="py-8 px-2">
  <div class="max-w-6xl mx-auto text-center">
    <h1 class="text-2xl md:text-3xl font-semibold text-indigo-900">
      Documents
    </h1>
    <p class="mt-3 text-indigo-600 max-w-2xl mx-auto">
      A curated collection of stotras, granthas, and historical records
      preserved for devotees and scholars.
    </p>
    <div class="w-12 h-1 bg-indigo-300 mx-auto mt-4 rounded-full"></div>
  </div>
</section>

<!-- ================= DOCUMENTS + SIDEBAR ================= -->
<div class="documents-container max-w-6xl mx-auto flex flex-col lg:flex-row gap-6 px-6 pb-24">

  <!-- ================= DOCUMENT GRID ================= -->
  <div class="documents-grid flex-1 grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-6 order-2 lg:order-1">
    <div
      *ngFor="let doc of filteredDocuments"
      (click)="openDocument(doc.url)"
      (keydown.enter)="openDocument(doc.url)"
      tabindex="0"
      role="button"
      class="group bg-white dark:bg-neutral-900
            rounded-2xl shadow-sm hover:shadow-lg
            hover:-translate-y-1 transition-transform duration-300
            p-4 flex flex-col justify-between
            cursor-pointer"
    >
      <!-- Cover Icon -->
      <div
        class="h-28 rounded-xl mb-4
               bg-gradient-to-br from-indigo-50 to-indigo-100
               dark:from-indigo-900 dark:to-neutral-800
               flex items-center justify-center"
      >
        <div
          class="w-12 h-12 rounded-lg
                 bg-indigo-600/90
                 flex items-center justify-center
                 text-white text-lg font-semibold
                 transform group-hover:scale-105
                 transition-transform duration-300"
        >
          📜
        </div>
      </div>

      <!-- Document Info -->
      <div class="flex-1">
        <h3 class="text-sm md:text-base font-semibold text-indigo-800 dark:text-indigo-300 leading-snug">
          {{ doc.title }}
        </h3>
        <p class="mt-1 text-xs md:text-sm text-indigo-600 dark:text-indigo-400">
          {{ doc.language }}
        </p>
      </div>

      <!-- Action -->
      <a
        [href]="doc.url"
        target="_blank"
        (click)="$event.stopPropagation()"
        class="mt-4 inline-flex items-center text-sm font-medium
              text-indigo-600 dark:text-indigo-400
              underline-offset-4
              transition-transform duration-200
              hover:-translate-y-0.5 hover:text-indigo-700"
      >
        Open document
      </a>
    </div>
  </div>

  <!-- ================= SIDEBAR ================= -->
  <aside
    class="sidebar w-full lg:w-64 flex-shrink-0 lg:sticky lg:top-24 order-1 lg:order-2 mb-6 lg:mb-0"
  >
    <h3 class="text-indigo-700 font-medium mb-4 text-lg">Filters</h3>

    <!-- Search by title -->
    <div class="mb-4">
      <label class="block text-sm text-indigo-600 mb-1">Search by title</label>
      <input
        type="text"
        [(ngModel)]="searchTerm"
        placeholder="Enter document name"
        class="w-full px-3 py-2 rounded-lg border border-indigo-300
               dark:border-indigo-700 bg-white/10 dark:bg-[#1A1F2B]/60
               text-indigo-700 dark:text-indigo-300
               focus:outline-none focus:ring-2 focus:ring-indigo-700 transition"
      />
    </div>

    <!-- Filter by language -->
    <div class="mb-4">
      <label class="block text-sm text-indigo-600 mb-1">Filter by language</label>
      <select
        [(ngModel)]="selectedLanguage"
        class="w-full px-3 py-2 rounded-lg border border-indigo-300
               dark:border-indigo-700 bg-white/10 dark:bg-[#1A1F2B]/60
               text-indigo-700 dark:text-indigo-300
               focus:outline-none focus:ring-2 focus:ring-indigo-700 transition"
      >
        <option value="">All languages</option>
        <option *ngFor="let lang of languages" [value]="lang">{{ lang }}</option>
      </select>
    </div>

    <!-- Optional: Add number of results -->
    <p class="text-indigo-600 text-sm mt-2">
      Showing {{ filteredDocuments.length }} document(s)
    </p>
  </aside>
</div>
