<app-page-breadcrumb pageTitle="Documents" />

<!-- ================= PAGE INTRO ================= -->
<section class="py-6 md:py-8 px-4">
  <div class="max-w-6xl mx-auto text-center">
    <h1 class="text-2xl md:text-3xl font-semibold text-indigo-900 dark:text-indigo-200">
      Documents
    </h1>
    <p class="mt-3 text-indigo-600 dark:text-indigo-400 max-w-2xl mx-auto">
      A curated collection of stotras, granthas, and historical records
      preserved for devotees and scholars.
    </p>
    <div class="w-12 h-1 bg-indigo-300 mx-auto mt-4 rounded-full"></div>
  </div>
</section>

<!-- ================= DOCUMENTS + SIDEBAR ================= -->
<div class="documents-container max-w-6xl mx-auto flex flex-col lg:flex-row gap-5 lg:gap-6 px-4 sm:px-6 pb-24">

  <!-- ================= DOCUMENT GRID ================= -->
  <div class="documents-grid flex-1 min-w-0 order-2 lg:order-1">

    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-3 sm:gap-5">

      <a *ngFor="let doc of filteredDocuments"
         [href]="doc.url"
         target="_blank"
         rel="noopener noreferrer"
         [attr.aria-label]="'Open ' + doc.title + ' (opens in a new tab)'"
         class="group flex flex-row sm:flex-col items-center sm:items-stretch gap-4 p-4
                rounded-xl bg-indigo-50 dark:bg-indigo-950/20
                border border-indigo-100 dark:border-indigo-900
                shadow-sm hover:shadow-md sm:hover:-translate-y-1
                transition-all duration-300
                focus:outline-none focus-visible:ring-2 focus-visible:ring-indigo-300/60">

        <!-- Cover icon -->
        <div class="shrink-0 w-14 h-14 sm:w-full sm:h-28 rounded-lg
                    bg-white dark:bg-indigo-900
                    border border-indigo-100 dark:border-indigo-800
                    flex items-center justify-center">
          <div class="w-10 h-10 sm:w-12 sm:h-12 rounded-lg
                      bg-indigo-200 dark:bg-indigo-800
                      flex items-center justify-center text-lg sm:text-xl
                      group-hover:scale-105 transition-transform duration-300">
            📜
          </div>
        </div>

        <!-- Info -->
        <div class="min-w-0 flex-1 sm:flex sm:flex-col">
          <h3 class="text-sm md:text-base font-semibold text-indigo-900 dark:text-indigo-200 leading-snug">
            {{ doc.title }}
          </h3>
          <p class="mt-1 text-xs md:text-sm text-indigo-600 dark:text-indigo-400">
            {{ doc.language }}
          </p>

          <!-- Action (desktop/tablet) -->
          <span class="hidden sm:inline-flex mt-4 items-center justify-center min-h-[40px] px-4 rounded-lg
                       text-sm font-medium
                       text-indigo-700 dark:text-indigo-300
                       border border-indigo-300 dark:border-indigo-700
                       group-hover:text-indigo-900 dark:group-hover:text-indigo-100
                       group-hover:bg-indigo-50 dark:group-hover:bg-indigo-900/20
                       transition">
            Open document →
          </span>
        </div>

        <!-- Arrow (phone) -->
        <span class="sm:hidden shrink-0 text-indigo-600 dark:text-indigo-400" aria-hidden="true">→</span>
      </a>

    </div>

    <!-- Empty state -->
    <div *ngIf="filteredDocuments.length === 0"
         class="py-12 text-center rounded-xl
                bg-indigo-50 dark:bg-indigo-950/20
                border border-indigo-100 dark:border-indigo-900">
      <p class="text-indigo-700 dark:text-indigo-300 font-medium">No documents match your filters.</p>
      <button type="button"
              (click)="searchTerm = ''; selectedLanguage = ''"
              class="mt-4 inline-flex items-center justify-center min-h-[44px] px-6 rounded-lg
                     font-medium text-indigo-700 dark:text-indigo-300
                     border border-indigo-300 dark:border-indigo-700
                     hover:text-indigo-900 dark:hover:text-indigo-100
                     hover:bg-indigo-50 dark:hover:bg-indigo-900/20
                     transition focus:outline-none focus:ring-2 focus:ring-indigo-300/40">
        Clear filters
      </button>
    </div>
  </div>

  <!-- ================= FILTERS ================= -->
  <aside class="sidebar w-full lg:w-64 shrink-0 lg:sticky lg:top-24 lg:self-start order-1 lg:order-2">
    <div class="bg-indigo-50 dark:bg-indigo-950/40
                border border-indigo-100 dark:border-indigo-900
                rounded-xl p-4">

      <h3 class="text-base font-semibold text-indigo-700 dark:text-indigo-300 mb-3">Filters</h3>

      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-1 gap-3">

        <!-- Search by title -->
        <div>
          <label for="doc-search" class="block text-sm text-indigo-600 dark:text-indigo-400 mb-1">
            Search by title
          </label>
          <input
            id="doc-search"
            type="search"
            [(ngModel)]="searchTerm"
            placeholder="Enter document name"
            class="w-full h-11 px-3 rounded-lg
                   bg-white dark:bg-indigo-900
                   border border-indigo-200 dark:border-indigo-800
                   text-indigo-900 dark:text-indigo-100
                   placeholder:text-indigo-400
                   focus:outline-none focus:ring-2 focus:ring-indigo-300/40 transition"
          />
        </div>

        <!-- Filter by language -->
        <div>
          <label for="doc-language" class="block text-sm text-indigo-600 dark:text-indigo-400 mb-1">
            Filter by language
          </label>
          <select
            id="doc-language"
            [(ngModel)]="selectedLanguage"
            class="w-full h-11 px-3 rounded-lg
                   bg-white dark:bg-indigo-900
                   border border-indigo-200 dark:border-indigo-800
                   text-indigo-900 dark:text-indigo-100
                   focus:outline-none focus:ring-2 focus:ring-indigo-300/40 transition"
          >
            <option value="">All languages</option>
            <option *ngFor="let lang of languages" [value]="lang">{{ lang }}</option>
          </select>
        </div>
      </div>

      <div class="mt-3 flex items-center justify-between gap-3">
        <p class="text-sm text-indigo-600 dark:text-indigo-400" aria-live="polite">
          Showing {{ filteredDocuments.length }} document(s)
        </p>

        <button *ngIf="searchTerm || selectedLanguage"
                type="button"
                (click)="searchTerm = ''; selectedLanguage = ''"
                class="shrink-0 inline-flex items-center justify-center min-h-[36px] px-3 rounded-lg
                       text-sm font-medium text-indigo-700 dark:text-indigo-300
                       border border-indigo-300 dark:border-indigo-700
                       hover:bg-indigo-50 dark:hover:bg-indigo-900/20
                       transition focus:outline-none focus:ring-2 focus:ring-indigo-300/40">
          Clear
        </button>
      </div>

    </div>
  </aside>
</div>
