<br><br><br>
<app-page-breadcrumb pageTitle="Documents" />

<!-- 🔹 PAGE TITLE -->
<div class="pt-4 pb-6 px-6 max-w-6xl mx-auto">
  <h1
    class="text-xl md:text-2xl font-semibold
           text-indigo-700 dark:text-indigo-300
           tracking-wide">
    Documents & Books
  </h1>
</div>

<!-- 📚 DOCUMENT GRID -->
<!-- 📚 DOCUMENT GRID -->
<section
  class="max-w-6xl mx-auto px-6 pb-16
         grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4">
         
  <div
    *ngFor="let doc of documents"
    class="group cursor-pointer rounded-xl
           bg-white dark:bg-neutral-900
           shadow-sm hover:shadow-md
           transition-all duration-300
           flex flex-col justify-between h-48">
           
    <!-- Icon / Cover Placeholder -->
    <div
      class="relative h-28 rounded-t-xl overflow-hidden
             bg-gradient-to-br from-sky-100 to-blue-50
             dark:from-indigo-900 dark:to-neutral-800
             flex items-center justify-center">

      <div
        class="w-12 h-12 rounded-lg
               bg-indigo-600/90
               flex items-center justify-center
               text-white text-xl font-semibold">
        📄
      </div>
    </div>

    <!-- Info -->
    <div class="p-3 flex flex-col justify-between h-full">
      <div>
        <h3
          class="text-sm md:text-base font-semibold
                 text-indigo-700 dark:text-indigo-300">
          {{ doc.title }}
        </h3>

        <p
          class="mt-1 text-xs md:text-sm
                 text-slate-600 dark:text-slate-400">
          {{ doc.language }}
        </p>
      </div>

      <!-- Open Button -->
      <a [href]="doc.url" target="_blank"
         class="mt-2 inline-block px-3 py-1.5
                text-white bg-indigo-700 dark:bg-indigo-500
                rounded-md text-sm font-medium
                hover:bg-indigo-800 dark:hover:bg-indigo-600
                transition">
        Open
      </a>
    </div>
  </div>
</section>
