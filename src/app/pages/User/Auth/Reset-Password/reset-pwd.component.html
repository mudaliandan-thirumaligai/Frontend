<div class="w-full max-w-md pt-10 mx-auto">
  <a
    routerLink="/"
    class="inline-flex items-center text-sm text-gray-500 transition-colors hover:text-gray-700 dark:text-gray-400 dark:hover:text-gray-300"
  >
    <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 20 20" fill="none" class="size-5">
      <path d="M12.7083 5L7.5 10.2083L12.7083 15.4167" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path>
    </svg>
    Back to dashboard
  </a>
</div>

<div class="flex flex-col justify-center flex-1 w-full max-w-md mx-auto">
  <div>
    <div class="mb-5 sm:mb-8">
      <h1 class="mb-2 font-semibold text-gray-800 text-title-sm dark:text-white/90 sm:text-title-md">
        Reset Password
      </h1>
      <p class="text-sm text-gray-500 dark:text-gray-400">
        Enter your old password and new password to update!
      </p>
    </div>

    <!-- Form -->
    <form (ngSubmit)="onResetPassword()" class="space-y-6">

      <!-- New Password -->
      <div>
        <app-label>New Password <span class="text-error-500">*</span></app-label>
        <div class="relative">
          <app-input-field
            type="'text'"
            placeholder="Enter old password"
            [(value)]="newPassword"
            name="newPassword"
            class="form-input"
            required
          />
        </div>
      </div>

      <!-- Confirm Password -->
      <div>
        <app-label>Confirm Password <span class="text-error-500">*</span></app-label>
        <div class="relative">
          <app-input-field
            type="'text'"
            placeholder="Enter new password"
            [(value)]="confirmPassword"
            name="confirmPassword"
            class="form-input"
            required
          />
        </div>
      </div>

      <div class="flex items-center justify-between"></div>

      <app-button
        className="w-full"
        size="sm"
        (btnClick)="onResetPassword()"
      >
        Reset Password
      </app-button>

    </form>
  </div>
</div>
