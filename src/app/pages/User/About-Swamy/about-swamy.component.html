<br>
<app-page-breadcrumb pageTitle="About Swamy" />

<!-- ================= ABOUT SWAMY INTRO ================= -->
<section class="py-2 px-2">
  <div class="max-w-5xl mx-auto text-center">
    <h1 class="text-2xl md:text-3xl font-semibold text-indigo-900">
      Aachariyan Perumai
    </h1>
    <div class="w-12 h-1 bg-indigo-300 mx-auto mt-4 rounded-full"></div>
  </div>
</section>

<!-- ================= AACHARIYAN PERUMAI PHOTOS ================= -->
<section class="py-2 px-1 sm:px-2 pb-12">
  <div class="max-w-5xl mx-auto space-y-4">

    <a *ngFor="let img of images; let i = index"
       [href]="img.src"
       target="_blank"
       rel="noopener"
       class="block bg-indigo-50 dark:bg-indigo-900/30 rounded-lg shadow-md overflow-hidden min-h-[200px]">
      <img
        [src]="img.src"
        [alt]="'Aachariyan Perumai ' + img.n"
        [attr.loading]="i === 0 ? 'eager' : 'lazy'"
        decoding="async"
        class="w-full h-auto block" />
    </a>

  </div>
</section>
