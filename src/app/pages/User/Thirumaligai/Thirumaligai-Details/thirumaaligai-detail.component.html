<app-page-breadcrumb
  parentLabel="Thirumaligai Locations"
  parentLink="/thirumaligais"
  [pageTitle]="place?.name || 'Thirumaligai'">
</app-page-breadcrumb>

<section *ngIf="place; else loading" class="max-w-5xl mx-auto px-6 py-10">

  <img
    [src]="place.image"
    [alt]="place.name"
    class="w-full h-[320px] object-cover rounded-2xl shadow-md mb-8"
  />

  <h1 class="text-3xl md:text-4xl font-bold text-indigo-900 mb-4">
    {{ place.name }}
  </h1>

  <p class="text-indigo-700 leading-relaxed text-lg md:text-xl">
    {{ place.description }}
  </p>

  <div class="mt-10">
    <a [href]="place.mapLink" target="_blank" rel="noopener noreferrer">
      <button
        class="inline-flex items-center text-indigo-700 font-medium
                  hover:text-indigo-900 transition
                  px-6 py-3 rounded-lg
                  border border-indigo-300 dark:border-indigo-700
                  focus:outline-none focus:ring-2 focus:ring-indigo-300/40">
        📍 View on Google Maps
      </button>
    </a>
  </div>

</section>

<ng-template #loading>
  <p class="text-center text-indigo-600 py-20">
    Loading Thirumaligai details…
  </p>
</ng-template>
