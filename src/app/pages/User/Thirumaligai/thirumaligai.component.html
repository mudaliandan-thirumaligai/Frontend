<app-page-breadcrumb pageTitle="Thirumaligai Locations" />

<!-- ================= LOCATIONS INTRO ================= -->
<section class="py-6 md:py-8 px-4">
  <div class="max-w-6xl mx-auto text-center">

    <h1 class="text-2xl md:text-3xl font-semibold text-indigo-900 dark:text-indigo-200">
      Our Thirumaligai Locations
    </h1>

    <p class="mt-3 text-indigo-600 dark:text-indigo-400 max-w-2xl mx-auto">
      Sacred locations where our Thirumaligais stand as centers of devotion, learning, and peace. Explore the places
      that continue to inspire spiritual connection.
    </p>

    <div class="w-12 h-1 bg-indigo-300 mx-auto mt-4 rounded-full"></div>

  </div>
</section>

<div class="max-w-6xl mx-auto px-4 sm:px-6">

  <!-- 🛕 LOCATIONS GRID -->
  <section class="pb-16 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 sm:gap-6">

    <article *ngFor="let place of thirumaligais"
             class="group rounded-xl
                    bg-indigo-50 dark:bg-indigo-950/20
                    border border-indigo-100 dark:border-indigo-900
                    shadow-sm hover:shadow-md
                    transition-all duration-300
                    flex flex-col justify-between
                    p-5">

      <!-- Info -->
      <div>
        <h3 class="text-base md:text-lg font-bold text-indigo-900 dark:text-indigo-200">
          {{ place.name }}
        </h3>

        <p class="mt-2 text-sm md:text-base text-indigo-700 dark:text-indigo-300 leading-relaxed">
          {{ place.shortDescription }}
        </p>
      </div>

      <!-- Actions -->
      <div class="mt-5 flex flex-col sm:flex-row lg:flex-col xl:flex-row gap-2">

        <a [routerLink]="['/thirumaligais', place.slug]"
           class="flex-1 inline-flex items-center justify-center min-h-[44px] px-4 py-2 rounded-lg
                  font-medium text-indigo-700 dark:text-indigo-300
                  border border-indigo-300 dark:border-indigo-700
                  hover:text-indigo-900 dark:hover:text-indigo-100
                  hover:bg-indigo-50 dark:hover:bg-indigo-900/20
                  transition focus:outline-none focus:ring-2 focus:ring-indigo-300/40">
          🛕 View Details
        </a>

        <a [href]="place.mapLink"
           target="_blank"
           rel="noopener noreferrer"
           [attr.aria-label]="'Directions to ' + place.name + ' (opens in a new tab)'"
           class="flex-1 inline-flex items-center justify-center min-h-[44px] px-4 py-2 rounded-lg
                  font-medium text-indigo-700 dark:text-indigo-300
                  border border-indigo-300 dark:border-indigo-700
                  hover:text-indigo-900 dark:hover:text-indigo-100
                  hover:bg-indigo-50 dark:hover:bg-indigo-900/20
                  transition focus:outline-none focus:ring-2 focus:ring-indigo-300/40">
          📍 Directions
        </a>

      </div>

    </article>

  </section>

</div>
