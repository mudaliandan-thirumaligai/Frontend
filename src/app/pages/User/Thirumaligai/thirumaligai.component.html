<br>
<app-page-breadcrumb pageTitle="Thirumaligai Locations" />

<!-- ================= LOCATIONS INTRO ================= -->
<section class="py-8 px-2">
  <div class="max-w-6xl mx-auto text-center">

    <!-- Title -->
    <h1 class="text-2xl md:text-3xl font-semibold text-indigo-900">
      Our Thirumaligai Locations
    </h1>

    <!-- Subtitle -->
    <p class="mt-3 text-indigo-600 max-w-2xl mx-auto">
      Sacred locations where our Thirumaligais stand as centers of devotion, learning, and peace. Explore the places that continue to inspire spiritual connection.
    </p>

    <!-- Divider -->
    <div class="w-12 h-1 bg-indigo-300 mx-auto mt-4 rounded-full"></div>

  </div>
</section>

<div class="max-w-6xl mx-auto px-6">

  <!-- 🛕 LOCATIONS GRID -->
  <section class="pb-16 grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">

    <div *ngFor="let place of thirumaligais"
         class="group rounded-xl
                bg-indigo-50 dark:bg-indigo-950/20
                border border-indigo-100 dark:border-indigo-900
                shadow-sm hover:shadow-md
                transition-all duration-300
                flex flex-col justify-between
                p-5 min-h-[180px]">

      <!-- Info -->
      <div>
        <h3 class="text-base md:text-lg font-bold text-blue-900 dark:text-blue-400">
          {{ place.name }}
        </h3>

        <p class="mt-2 text-sm md:text-base text-indigo-700 dark:text-indigo-300 leading-relaxed">
          {{ place.description }}
        </p>
      </div>

      <!-- details Button -->
      <div class="mt-4">
        <a [routerLink]="['/thirumaligais', place.slug]">
          <button
            type="button"
            class="inline-flex items-center text-indigo-700 font-medium
                  hover:text-indigo-900 transition
                  px-6 py-3 rounded-lg
                  border border-indigo-300 dark:border-indigo-700
                  focus:outline-none focus:ring-2 focus:ring-indigo-300/40">
            🛕 View Details
          </button>
        </a>
      </div>


    </div>

  </section>

</div>
