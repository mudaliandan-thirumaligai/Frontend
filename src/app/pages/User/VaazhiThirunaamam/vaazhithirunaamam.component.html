<div class="min-h-screen bg-gradient-to-b from-gray-50 to-white dark:from-gray-950 dark:to-gray-900 pb-20">
  <app-page-breadcrumb pageTitle="Vaazhi Thirunaamam" />

  <!-- ================= VAAZHI THIRUNAAMAM INTRO ================= -->
  <section class="py-8 px-2">
    <div class="max-w-5xl mx-auto text-center">

      <!-- Title -->
      <h1 class="text-2xl md:text-3xl font-semibold text-indigo-900 dark:text-white">
        Srivaishnava Guruparambarai Vaazhi Thirunaamam
      </h1>

      <!-- Subtitle -->
      <p class="mt-3 text-indigo-600 dark:text-gray-400 max-w-2xl mx-auto">
        Sacred verses of praise celebrating the divine appearance and glory of our Acharyas.
      </p>

      <!-- Divider -->
      <div class="w-12 h-1 bg-indigo-300 dark:bg-brand-500 mx-auto mt-4 rounded-full"></div>

    </div>
  </section>

  <!-- ================= VAAZHI THIRUNAAMAM CONTENT ================= -->
  <section class="px-2">
    <div class="max-w-6xl mx-auto grid gap-8 card-grid">

      <!-- Card -->
      <div
        *ngFor="let item of vaazhiThirunaamams"
        class="bg-white dark:bg-white/[0.03] rounded-3xl shadow-lg
               border border-gray-100 dark:border-white/5
               overflow-hidden transition-all hover:shadow-2xl
               animate-card"
      >
        <div class="relative">
          <!-- Top Accent -->
          <div class="absolute top-0 left-0 right-0 h-2 bg-gradient-to-r from-indigo-500 to-indigo-500"></div>

          <div class="p-6 md:p-8">
            <!-- Header -->
            <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-6">
              <div>
                <h3 class="text-xl md:text-2xl font-bold text-indigo-900 dark:text-white">
                  {{ item.name }}
                </h3>

                <p
                  *ngIf="item.subtitle"
                  class="text-sm md:text-base text-indigo-600 dark:text-gray-400 mt-1"
                >
                  {{ item.subtitle }}
                </p>
              </div>

              <span
                class="inline-flex items-center rounded-full
                       bg-indigo-100 dark:bg-brand-500/10
                       px-4 py-2 text-xs font-semibold uppercase tracking-wider
                       text-indigo-700 dark:text-brand-400"
              >
                {{ item.nakshatram }}
              </span>
            </div>

            <!-- Divider -->
            <div class="w-16 h-0.5 bg-indigo-200 dark:bg-white/10 mb-6"></div>

            <!-- Verses -->
            <div class="prose prose-lg dark:prose-invert max-w-none">
              <p
                class="font-serif italic leading-loose
                       text-gray-700 dark:text-gray-300
                       text-base md:text-lg"
              >
                <ng-container *ngFor="let line of item.verses">
                  {{ line }}<br />
                </ng-container>
              </p>
            </div>

          </div>
        </div>
      </div>
      <!-- End Card -->

    </div>
  </section>
</div>
